openapi: 3.0.3
servers:
  - url: https://api.serverless.runware.ai

info:
  title: Serverless API
  version: 0.6.0
  license:
    name: Proprietary
  description: >
    Control plane and task-ingestion API for the Runware Serverless platform.

    A Runware organisation is the tenant boundary. Apps are addressed as
    `/v1/apps/{appId}` and endpoints are invoked as
    `/v1/apps/{appId}/invoke-async/{endpointPath}` (async invocation) or
    `/v1/apps/{appId}/invoke-sync/{endpointPath}` (sync invocation).


    Two authentication schemes are accepted, both as bearer tokens. A Runware API key
    (CLI and SDK) is validated against the existing Runware platform server-to-server; the
    key identifies the organisation. An org-scoped JWT (web app) is minted by the Runware
    platform for one user acting in one organisation and verified locally against the
    platform's published JWKS. Resources are always scoped to the authenticated
    organisation, whichever scheme carried it. Task ingestion and task reads accept the
    API key only.

security:
  - ApiKeyAuth: []
  - OrgJwtAuth: []

tags:
  - name: Tasks
    description: Submit work to app endpoints and inspect task status
  - name: Apps
    description: Manage apps and their lifecycle
  - name: SourceUploads
    description: >
      Stage a source archive, then read the immutable source a completed upload
      publishes for app create and update
  - name: Builds
    description: Immutable builds
  - name: Versions
    description: App versions produced by successful builds
  - name: Endpoints
    description: Named endpoints exposed by an app
  - name: Compute
    description: Compute hardware catalogues (GPU types) and pricing
  - name: Workers
    description: Running worker instances (read-only runtime state)
  - name: Secrets
    description: Organisation-scoped encrypted secrets
  - name: EnvironmentVariables
    description: Plain-text environment variables scoped to an app
  - name: Observability
    description: Usage, events and errors
  - name: Tenancy
    description: >
      Platform-only organisation tenancy (ADR-019). Restricted to the Runware
      platform organisation. Admin-api calls these when serverlessAccess changes.

paths:
  # ---------------------------------------------------------------------------
  # Compute (GPU catalogue)
  # ---------------------------------------------------------------------------
  /v1/gpu-types:
    get:
      tags:
        - Compute
      summary: List supported GPU types and their pricing
      description: >
         Returns the global GPU type catalogue and pricing. The request requires authentication.
         Customer principals receive only GPU types with capacity currently offered to customers;
         a type whose hardware is not yet cleared for customer workloads is omitted. The Runware
         principal receives the full catalogue, including retired types and types not yet offered.
         Retired entries carry `deletedAt`. Each entry's `pricing` is the price currently in effect;
         the Runware principal can read the full price
         history, including scheduled future changes, from
         `GET /v1/gpu-types/{gpuTypeId}/prices`.
      operationId: listGpuTypes
      responses:
        '200':
          description: GPU type catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuTypeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Compute
      summary: Add a GPU type to the catalogue
      description: >
        Creates a new entry in the global GPU type catalogue. Restricted to the Runware platform
        organization. The `id` (catalogue code) is immutable and remains reserved after retirement.
      operationId: createGpuType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpuTypeCreate'
      responses:
        '201':
          description: GPU type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/gpu-types/{gpuTypeId}:
    get:
      tags:
        - Compute
      summary: Get a GPU type from the catalogue
      description: >
        Returns an active entry from the global GPU type catalogue. Retired entries return `404`.
        The result is not organisation-specific, but the request still requires authentication.
      operationId: getGpuType
      parameters:
        - $ref: '#/components/parameters/GpuTypeId'
      responses:
        '200':
          description: The GPU type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
        - Compute
      summary: Update a GPU type in the catalogue
      description: >
        Updates mutable fields of an active GPU type. Restricted to the Runware platform organization.
        The catalogue code (`gpuTypeId`) cannot be changed; retired entries return `404`.
      operationId: updateGpuType
      parameters:
        - $ref: '#/components/parameters/GpuTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpuTypeUpdate'
      responses:
        '200':
          description: Updated GPU type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Compute
      summary: Retire a GPU type from the catalogue
      description: >
        Soft-deletes a GPU type while preserving its code and price history. Restricted to the
        Runware platform organization. Returns `409` if a worker configuration or GPU pool still
        references the code. Retiring an already retired code returns `404`.
      operationId: deleteGpuType
      parameters:
        - $ref: '#/components/parameters/GpuTypeId'
      responses:
        '204':
          description: GPU type retired
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/gpu-types/{gpuTypeId}/prices:
    get:
      tags:
        - Compute
      summary: List historical and future prices of a GPU type
      description: >
        Returns a page of a GPU type's prices, ordered by effectiveFrom. Restricted to the Runware
        platform organization: the page includes retired types and prices that are scheduled but not yet in effect.
        Customers read the price currently in effect from `GET /v1/gpu-types`.
      operationId: listGpuTypePrices
      parameters:
        - $ref: '#/components/parameters/GpuTypeId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of prices for the GPU type
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GpuPricingListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Compute
      summary: Schedule a new price for a GPU type
      description: >
        Schedules a new price to take effect at `effectiveFrom`. Restricted to the Runware platform
        organization. `effectiveFrom` must normally be more than 7 days in the future. Before a GPU
        type is admitted or used, a later price can be added inside that window to correct its initial
        price. This preserves the original row and records the correction as a superseding price.
        Retired types return `404`; other values inside the notice window return `422`.
        Returns `409` if the GPU type already has a price scheduled at that exact instant.
      operationId: createGpuTypePrice
      parameters:
        - $ref: '#/components/parameters/GpuTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpuPricingCreate'
      responses:
        '201':
          description: Price scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuPricing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/gpu-types/{gpuTypeId}/prices/{priceId}:
    patch:
      tags:
        - Compute
      summary: Update a scheduled price for a GPU type
      description: >
        Partially updates a scheduled price. Restricted to the Runware platform organization.
        Only a price whose current `effectiveFrom` is still more than 7 days in the future can be
        edited — once inside that window the price is locked in and this returns `409`. A
        supplied `effectiveFrom` must itself be more than 7 days in the future, returning `422`
        otherwise. Retired GPU types return `404`. Returns `409` if the update collides with
        another price already scheduled at that exact instant.
      operationId: updateGpuTypePrice
      parameters:
        - $ref: '#/components/parameters/GpuTypeId'
        - name: priceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpuPricingUpdate'
      responses:
        '200':
          description: Price updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuPricing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Compute
      summary: Remove a scheduled price for a GPU type
      description: >
        Deletes a scheduled price. Restricted to the Runware platform organization. Only a price
        whose effectiveFrom is still more than 7 days in the future can be deleted — once inside that
        window the price is locked in (about to take effect, or already has) and this returns
        `409`. Retired GPU types return `404`.
      operationId: deleteGpuTypePrice
      parameters:
        - $ref: '#/components/parameters/GpuTypeId'
        - name: priceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Price deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Tasks
  # ---------------------------------------------------------------------------
  /v1/apps/{appId}/invoke-async/{endpointPath}:
    post:
      tags:
        - Tasks
      summary: Start a new async task
      description: >
        Starts a new async task on `appId`, routing the request body payload to an available
        worker. The task runs asynchronously and the response is `202`; poll
        `GET /v1/apps/{appId}/tasks/{taskId}` for completion. Resubmitting a task id is
        answered with the task it already names rather than starting a second one, so the
        `202` can carry a task that has already finished: read its `status` instead of
        assuming `pending`, and note it may name a different `appId`. Apps in
        `initializing`, `active`, or `stopping` accept invocation. `stopped`, `deleting`, and
        `failed` return `409 Conflict`; unknown or deleted apps return `404 Not Found`. An
        organisation whose serverless tenancy is revoked, or has no tenancy receipt
        at all, returns `403 Forbidden`, distinguishing that from an app that does
        not exist. An organisation whose tenancy is still being provisioned
        returns `503 Service Unavailable` instead — that state is retryable, not a
        revocation, and clears once provisioning finishes.
        Endpoint membership is checked against the active version's endpoint set before
        the task is accepted: an endpoint the app does not declare returns `404` whose
        `endpointPath` extension member carries the rejected path, distinguishing it
        from an unknown app, and the task never enters the queue.
      operationId: startAsyncTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/EndpointPath'
      requestBody:
        $ref: '#/components/requestBodies/TaskInvocation'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/apps/{appId}/invoke-sync/{endpointPath}:
    post:
      tags:
        - Tasks
      summary: Start a new sync task
      description: >
        Starts a new sync task on `appId`, routing the request body payload to an available
        worker. The request blocks until the task is terminal and returns the result inline (`200`).
        Resubmitting a task id waits on the task it already names rather than starting a second
        one, so the `200` carries that task's result and may name a different `appId` — poll it
        under the one returned. A task that outlives the wait window is **not** a failure: the
        task is still queued or running, and the response is `202` carrying that task with
        `status: pending` — the same shape `invoke-async` returns, and it names the owning
        `appId` on a resubmission just as the `200` does. Poll
        `GET /v1/apps/{appId}/tasks/{taskId}` for its result. A request the platform cannot
        attribute to an accepted task fails instead, with no task to poll. Apps in
        `initializing`, `active`, or `stopping` accept invocation. `stopped`, `deleting`, and
        `failed` return `409 Conflict`; unknown or deleted apps return `404 Not Found`. An
        organisation whose serverless tenancy is revoked, or has no tenancy receipt
        at all, returns `403 Forbidden`, distinguishing that from an app that does
        not exist. An organisation whose tenancy is still being provisioned
        returns `503 Service Unavailable` instead — that state is retryable, not a
        revocation, and clears once provisioning finishes. Endpoint
        membership is checked against the active version's endpoint set before the task
        is accepted: an endpoint the app does not declare returns `404` whose
        `endpointPath` extension member carries the rejected path, distinguishing it
        from an unknown app, and the task never enters the queue.
      operationId: startSyncTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/EndpointPath'
      requestBody:
        $ref: '#/components/requestBodies/TaskInvocation'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/apps/{appId}/tasks/{taskId}:
    get:
      tags:
        - Tasks
      summary: Get a task
      description: >
        Returns the task's current status, read through the inference transport layer from the
        shared result store. When `completed`, includes the result `output` and `completedAt`;
        when `failed`, includes `error`; when `pending`, neither is set. If the app is
        `stopped`, `deleting`, or `failed`, accepted task results stay readable. A `404 Not Found`
        means the task cannot currently be verified for this app. Because enqueue-time
        ownership tracking is best effort, a recently returned task ID can temporarily return
        `404`; retry it within the normal polling window. Unknown or deleted apps also
        return `404 Not Found`.
      operationId: getTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: taskId
          in: path
          required: true
          description: Task identifier, supplied by the caller when the task was submitted.
          schema:
            $ref: '#/components/schemas/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/apps/{appId}/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks for an app
      description: >
        Lists TTL-bounded asynchronous task metadata for this app so a client
        can recover task ids after an interrupted long-poll or CLI session. Pending
        includes queued, running and retrying work. Tasks appear only within the
        configured recovery window. A page can be empty and still have `nextCursor`;
        continue until it is null. Pending entries are best effort and may disappear
        if the recovery store restarts; tracked tasks reappear on completion. This is
        not persisted task history. A task id names one task, so resubmitting one
        does not add a second entry here. If the app is `stopped`, `deleting`, or `failed`,
        recovery stays available. Unknown or deleted apps return `404 Not Found`.
      operationId: listTasks
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: A page of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Apps
  # ---------------------------------------------------------------------------
  /v1/apps:
    get:
      tags:
        - Apps
      summary: List apps
      description: >
        Returns a page of the organisation's apps. Filters combine with AND; soft-deleted
        apps are excluded unless `status=deleted` is requested explicitly. Favourited apps
        appear before non-favourited apps, with the selected ordering applied within each group.


        A `cursor` is only valid for the `sort` and filters it was issued under — reusing one
        across a different ordering or filter set returns `400`.
      operationId: listApps
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Return only apps in this status.
          schema:
            $ref: '#/components/schemas/AppStatus'
        - name: q
          in: query
          required: false
          description: >
            Case-insensitive substring match against `appName` and `appId`.
            An app matching either is returned.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: gpuType
          in: query
          required: false
          description: >
            Return only apps whose worker configuration requests this GPU type.
            Matched against `configuration.gpuType` only, not `fallbackGpuType`. Must be a
            code from `GET /v1/gpu-types`; an unknown code returns `422`.
          schema:
            $ref: '#/components/schemas/GpuTypeId'
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppSort'
      responses:
        '200':
          description: A page of apps
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Apps
      summary: Create an app
      description: >
        Creates an app together with its worker configuration, environment variables and
        endpoints, and records version `1` — the immutable description of what to deploy. The
        app starts in `initializing`, and what happens next depends on the app
        source type:


        - `code` source: the codebase is submitted to the build pipeline; once the image is built
          and workers become healthy the app transitions to `active` and `activeVersionId`
          points at that version. If the build, validation, or rollout fails the app is
          marked `failed`.

        - `container` source: the submitted zip (wrapper `Dockerfile` + `container.yaml`)
          goes through the same build pipeline — the wrapper image is built, published and
          deployed, so the version carries a `buildId` and the app follows the same
          lifecycle as a code source. An invalid `container.yaml` rejects the create
          before any build capacity is spent — `400` where the document could not be
          parsed at all, `422` where it parsed and broke a rule.


        `activeVersionId` is null until a rollout completes: a version records what should run,
        and only a finished deploy says what does.


        `secrets` attaches organisation secrets that already exist. It is the app's initial
        attachment set, so the first rollout carries their values into the worker. This
        route does not create a secret — use `POST /v1/secrets` first. A name that is
        unknown to the organisation, or that is not `active`, returns `404`. A name that
        collides with a key in `environmentVariables`, a repeated name and a set that goes
        past the binding limit each return `422`. The whole set is checked before any build
        capacity is spent.
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppCreate'
      responses:
        '201':
          description: App created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/apps/{appId}:
    get:
      tags:
        - Apps
      summary: Get an app
      description: >
        Returns the app the authenticated organisation owns under this `appId`. An unknown
        app and a soft-deleted one both return `404 Not Found`: a deleted app is gone to
        its owner, and its rows are retained only for billing and audit. To read deleted
        apps, list them with `status=deleted`.
      operationId: getApp
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: The app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Apps
      summary: Update an app
      description: >
        Patches one or more aspects of an app in place. All fields are optional; omitted
        fields are left unchanged. Valid in any non-`deleted` status, including `stopped`
        (changes apply on `resume`). Lifecycle transitions use the dedicated `deploy`, `stop`,
        `resume`, and `delete` operations.

        A configuration or `environmentVariables` change records a new version with
        the same image. If that image is deployable, the update pins it as
        `activeVersionId` and rolls the workload when the app is `active` or
        `initializing`. A `failed` app is moved to `initializing` and rolled, the
        same as `POST /deploy`. If the image is not deployable, the version is
        recorded and `activeVersionId` is left unchanged. If the roll fails,
        `activeVersionId` is restored and the previous configuration keeps serving.
        A name-only change records a version and does not pin. A `stopped` or
        `stopping` app pins the version and rolls it on `resume`. A
        configuration, `environmentVariables`, or `appSource` change while a
        create or resume rollout is already in progress returns `409 Conflict`.
        A name-only or `secrets`-only change does not.

        `appSource` starts a build and records version N+1 with a new image tag.
        The deploy queue carries the build-then-deploy tail; `activeVersionId`
        moves only when that rollout completes. A builder rejection (400 where
        a container document's parser refused it, 422 where it parsed and broke
        a rule) leaves the app on its current version and writes no version row
        and no build row. After the builder accepts, version N+1 is recorded
        even if a concurrent secret deactivation or env/secret collision
        prevents this request's env/secrets overlay; in that case the previous
        environmentVariables and attachment set stay in place and are what the
        new version snapshots.

        `environmentVariables` replaces the whole set: a key absent from the map
        is deleted, and a null value omits that key from the new set. The
        resolved map is snapshotted onto the new version.

        `secrets` replaces the whole attachment set. An attachment absent from
        the array is detached. Injected names must not collide with a plain
        environment variable on the app; the combined set of plain variables and
        attachments is capped at 100. This is a control-plane record only —
        secret values do not reach a pod, and the version snapshot carries no
        secrets — so a secrets-only change does not roll the workload.

        Endpoints are not a field of this contract: the set belongs to the app
        source, so it changes only when a new version with a new source builds
        and deploys.
      operationId: updateApp
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpdate'
      responses:
        '200':
          description: Updated app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Apps
      summary: Delete an app
      description: >
        Soft delete. Sets `status = deleting` and returns `202` once that intent is persisted.
        Router removal, cancelling in-progress builds, and worker drain
        (`draining → stopping → stopped`) are performed asynchronously by the deployer/Scaler;
        `status` becomes `deleted` once all workers stop. All rows are retained for billing
        finalisation, audit, and usage history. Idempotent if the app is already
        `deleting`.


        The `appId` is released once `status` reaches `deleted`, and not before: while the app
        is `deleting` its workload is still being torn down and the name stays taken. A new app
        created under a released name is a new app and inherits nothing — no version, no build,
        no event history, and no workers.
      operationId: deleteApp
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '202':
          description: Delete accepted; status is deleting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/source-uploads:
    post:
      tags:
        - SourceUploads
      summary: Create a source upload
      description: >
        Creates an upload session for a source archive. The session belongs to the
        authenticated organization and names no app: an upload precedes any app, and the
        source it publishes may back several. The response contains a short-lived transfer
        instruction for one exact staging object. Repeating the request with the same
        idempotency key and declaration while the session is pending and unexpired returns
        the same upload resource with a refreshed transfer instruction. Replays with a
        different declaration, or after the session becomes ready, rejected, expired, or
        deleted, return `409`.
      operationId: createSourceUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUploadCreate'
      responses:
        '201':
          description: Source upload created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceUploadCreation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/source-uploads/{uploadId}:
    get:
      tags:
        - SourceUploads
      summary: Get a source upload
      description: >
        Returns the upload session belonging to the authenticated organization. Once the
        upload is `ready` the session carries the `sourceId` it published. An upload
        belonging to another organization returns `404`.
      operationId: getSourceUpload
      parameters:
        - $ref: '#/components/parameters/SourceUploadId'
      responses:
        '200':
          description: Source upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - SourceUploads
      summary: Abort a source upload
      description: >
        Aborts an upload that has not published its source and removes its staging object.
        The session remains as a deleted tombstone so its staging key cannot be reused.
        Repeating a successful abort is idempotent. A `ready` upload cannot be aborted: the
        source it published is a resource in its own right, and the request answers `409`
        with type `source-upload-completed`.
      operationId: deleteSourceUpload
      parameters:
        - $ref: '#/components/parameters/SourceUploadId'
      responses:
        '204':
          description: Source upload aborted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/source-uploads/{uploadId}/complete:
    post:
      tags:
        - SourceUploads
      summary: Complete a source upload
      description: >
        Verifies the staging object's length, content type, and SHA-256 digest against the
        session declaration, applies the archive rules for the source type, and publishes
        the verified bytes as an immutable source artifact. The first success creates the
        source and returns the ready session carrying its `sourceId`; a retry returns the
        same session and the same `sourceId`. A rejected upload keeps its rejection so later
        retries return the same result.
      operationId: completeSourceUpload
      parameters:
        - $ref: '#/components/parameters/SourceUploadId'
      responses:
        '200':
          description: Source upload ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/sources/{sourceId}:
    get:
      tags:
        - SourceUploads
      summary: Get a source
      description: >
        Returns the immutable source artifact a completed upload published: its type and
        the length and digest upload completion verified. A source is organization-scoped
        and may be named by any number of apps and versions in that organization; one
        belonging to another organization returns `404`. There is no list and no delete.
      operationId: getSource
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/apps/{appId}/deploy:
    post:
      tags:
        - Apps
      summary: Deploy a version
      description: >
        Activates a `ready` version by number, setting `activeVersionId` and returning `202`
        once that intent is persisted. Worker rollout, routing switch, and cancelling
        in-progress builds (`superseded`) are performed asynchronously
        by the deployer/Scaler. Permitted in any addressable status, including `initializing`
        and `failed`.

        To roll back, supply an older `versionNumber` — the operation is identical to a forward
        deploy. No new version is created and no rebuild happens: the version's existing image
        is re-applied. Re-deploying the currently active version is permitted and re-applies it.

        A deploy to a `stopped` or `stopping` app records the version and rolls no
        workload, because no workers are running: the `202` does not imply a rollout there.
        The recorded version is the one applied when the app resumes.

        If the roll of a live app fails, `activeVersionId` is restored to the version
        that kept serving, so the field keeps naming the running image.

        **Rollout** (deployer/Scaler): the platform starts workers on the target version, waits
        for at least one to become healthy, switches task routing to the new version, then
        drains old-version workers gracefully. Old workers are given a fixed, platform-managed
        grace period to finish in-flight tasks before being force-terminated. If new workers
        fail to become healthy, old workers are not drained and the app continues on the
        previous version.

        Errors:
        - Deploy to a `deleting` app returns `409 Conflict`
        - `versionNumber` not found or not `ready` returns `409 Conflict`
        - Deploy to a non-existent or `deleted` app returns `404 Not Found`
      operationId: deployVersion
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
      responses:
        '202':
          description: Deploy accepted; activeVersionId updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/apps/{appId}/stop:
    post:
      tags:
        - Apps
      summary: Stop an app
      description: >
        Moves the app to `stopping` and returns `202` once that intent is persisted.
        Scale-to-zero and worker drain are performed asynchronously by the Scaler; `status`
        becomes `stopped` once all workers drain. In-flight tasks have a fixed,
        platform-managed grace period to complete; workers that exceed it are force-terminated
        and their tasks return to the queue per delivery guarantees. New task submissions remain
        accepted while `stopping`; after the app reaches `stopped`, submissions return
        `409 Conflict`. Precondition: `status = active`.
      operationId: stopApp
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '202':
          description: Stop accepted; status is stopping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/apps/{appId}/resume:
    post:
      tags:
        - Apps
      summary: Resume an app
      description: >
        Moves the app to `initializing` and returns `202` once that intent is persisted.
        The Scaler then starts workers and sets the app to `active`; tasks that remained
        queued when the app stopped are consumed as workers come online. Precondition:
        `status = stopped`.
      operationId: resumeApp
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '202':
          description: Resume accepted; app is initializing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/apps/{appId}/favourite:
    put:
      tags:
        - Apps
      summary: Favourite an app
      description: >
        Pins the app as a favourite for the authenticated organisation so the console
        can surface it in a Favourites section. Idempotent: favouriting an already-favourited
        app succeeds and returns the app with `isFavourite: true`. Apps
        in `deleting` or `deleted` status cannot be favourited (`404`). Soft-delete clears any
        existing pin when status becomes `deleting`.
      operationId: favouriteApp
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: App is favourited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Apps
      summary: Unfavourite an app
      description: >
        Removes the organisation favourite pin from the app. Idempotent: unfavouriting
        an app that is not favourited succeeds and returns the app with
        `isFavourite: false`. Valid in any status including `deleting` and `deleted` — unpinning
        is not an app lifecycle mutation. Missing apps return `404`.
      operationId: unfavouriteApp
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: App is not favourited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/app-summary:
    get:
      tags:
        - Apps
      summary: App summary metrics for the authenticated organisation
      description: >
        Aggregate dashboard metrics across all apps owned by the authenticated organisation.
        App and worker tallies are always present. Request and error-rate totals come from
        the metrics store and are omitted when that hop cannot answer rather than reported
        as zero. Spend is omitted until billing rollups exist.
      operationId: getAppSummary
      responses:
        '200':
          description: App summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'

