  /v1/apps/{appId}/environment-variables/{variableName}:
    put:
      tags:
        - EnvironmentVariables
      summary: Update an app environment variable
      description: >-
        Sets one environment variable, creating it if absent. Names the platform sets on
        the serving container itself are rejected with `422`, as they are on create.


        An app holds at most 100 environment bindings in total — plain
        variables plus attached secrets — the same combined ceiling
        `AppCreate.environmentVariables` declares (create rejects secrets
        in-request; attach grows the set later). Overwriting an existing variable
        is always allowed; adding one past the ceiling returns `422`.


        The name must not collide with a secret already attached to this app
        (the secret's injected env var name). Secrets and plain env vars share the
        pod environment; a duplicate would be resolved last-wins by kubelet with no
        error, so the server rejects it with `422`. The reverse check applies on
        attach.
      operationId: updateAppEnvironmentVariable
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: variableName
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EnvironmentVariableName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentVariableUpdate'
      responses:
        '200':
          description: Environment variable updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVariable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - EnvironmentVariables
      summary: Delete an app environment variable
      operationId: deleteAppEnvironmentVariable
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: variableName
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EnvironmentVariableName'
      responses:
        '204':
          description: Environment variable deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  /v1/apps/{appId}/events:
    get:
      tags:
        - Observability
      summary: List app events
      operationId: listAppEvents
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppEventType'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AppEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/usage:
    get:
      tags:
        - Observability
      summary: List usage events
      description: Append-only billing telemetry; one row per worker state transition.
      operationId: listUsageEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: appId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppId'
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on event time (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on event time (RFC 3339).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of usage events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UsageEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: >
        Runware API key supplied as a bearer token. Validated server-to-server against the
        existing Runware platform; the key identifies the organisation.
    OrgJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Org-scoped JWT supplied as a bearer token, minted by the Runware platform for one
        user acting in one organisation and verified locally against the platform's
        published JWKS. Serves the web app; the CLI and SDK use ApiKeyAuth.

  parameters:
    AppId:
      name: appId
      in: path
      required: true
      description: Immutable app identifier, unique within the authenticated organisation.
      schema:
        $ref: '#/components/schemas/AppId'
    GpuTypeId:
      name: gpuTypeId
      in: path
      required: true
      description: Public catalogue code for a GPU type (e.g. `h100`), not the internal row UUID.
      schema:
        $ref: '#/components/schemas/GpuTypeId'
    WorkerId:
      name: workerId
      in: path
      required: true
      description: >
        Worker identifier — the Kubernetes pod UID recorded by the reconciler.
      schema:
        type: string
        format: uuid
    EndpointPath:
      name: endpointPath
      in: path
      required: true
      description: >
        Path of the endpoint to route the task to, as returned by `listEndpoints`:
        a bare lowercase segment such as `generate`, with no leading slash.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-z]([a-z0-9-]{0,62}[a-z0-9])?$'
    SecretName:
      name: secretName
      in: path
      required: true
      description: Secret name, unique within the authenticated organisation.
      schema:
        $ref: '#/components/schemas/SecretName'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned as `nextCursor` by a previous call.
      schema:
        type: string

  requestBodies:
    TaskPayload:
      required: true
      description: Arbitrary JSON payload forwarded to the endpoint's RPC handler.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  responses:
    Task:
      description: The task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Task'
    TaskAccepted:
      description: Task accepted and pending
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Task'
    BadRequest:
      description: >
        The request was malformed and could not be parsed (e.g. invalid JSON).
        A well-formed request that fails validation returns `422` instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: A required service is temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Authenticated but not permitted to access this resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Resource already exists or the request conflicts with its current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: >
        The request was well-formed but semantically invalid (e.g. a missing or
        out-of-range field). A request that could not be parsed returns `400`.
        The `errors` array carries one entry per offending field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Timeout:
      description: Task timed out; `taskId` is present when the accepted task is known.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    AppId:
      type: string
      description: Immutable app identifier, unique within the authenticated organisation.
      minLength: 6
      maxLength: 30
      pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'

    AppName:
      type: string
      description: >
        Mutable display name. Must contain at least one non-whitespace character:
        it is what the console renders and what `sort=name` orders on, and it is
        not required to be unique. Unlike `appId` the pattern is
        unanchored, so interior spaces are allowed — only an entirely blank name
        is rejected.
      minLength: 1
      pattern: '\S'

    EnvironmentVariableName:
      type: string
      description: >
        POSIX-style environment variable name. Letters, digits, and underscore;
        must start with a letter or underscore. Matched by the
        `deployment_configs` column CHECK so a valid-by-contract request cannot
        500 at INSERT.
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'

    SecretName:
      type: string
      description: >
        Organisation-scoped secret name. The shape matches
        `EnvironmentVariableName` and the `secrets.name` /
        `deployment_secrets.env_var_name` column CHECKs — one rule for the
        contract and the schema — because attached secrets are intended to be
        injected as environment variables once ADR-019 in-pod unseal lands.

        Names the platform sets on the serving container (`RUNTIME`,
        `DISABLE_NGINX`, `MLFLOW_MODELS_WORKERS`, `UVICORN_HOST`) are rejected
        with `422`: when injection exists, the deployer appends customer env
        after its own and kubelet resolves duplicates last-wins, so an accepted
        collision would silently replace a platform value. Same guard as plain
        environment variables; enforced by the server (not expressible as a
        pattern here).
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'

    # ---- Enums -------------------------------------------------------------
    AppStatus:
      type: string
      enum:
        - initializing
        - active
        - stopping
        - stopped
        - deleting
        - deleted
        - failed
    AppSort:
      type: string
      description: >
        Ordering for `listApps`. Every ordering is total (ties broken by
        `appId`), so a page is reproducible and its cursor stable.


        - `createdAt`: newest first. The default.

        - `name`: `appName` A–Z, case-insensitive.

        - `activity`: most recently active first.

        - `errorRate`: highest error rate first.


        `activity` and `errorRate` rank on per-app traffic metrics, which are not
        collected yet; requesting either returns `422` until they are.
      default: createdAt
      enum:
        - createdAt
        - name
        - activity
        - errorRate
    BuildStatus:
      type: string
      description: Build/validation lifecycle status.
      enum:
        - queued
        - building
        - ready
        - failed
        - superseded
    ComputeType:
      type: string
      description: >
        Worker compute class. GPU is the only supported value. CPU workloads
        are not supported.
      enum:
        - gpu
    WorkerStatus:
      type: string
      description: >
        Worker lifecycle status. Also the type of `UsageEvent.eventType`, which
        records a ledger subset of these states (see that field — `busy` never
        appears there). `unhealthy` means the pod exists but failed to become
        or stay ready, not an intentional drain or stop.
      enum:
        - pending
        - pulling
        - loading
        - ready
        - busy
        - unhealthy
        - draining
        - stopping
        - stopped
    TaskStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
    SecretType:
      type: string
      description: >
        Kind of secret. Only the environment-variable variant (`generic`) is
        supported. Image-pull (`registry`) credentials are consumed by the
        kubelet before any container starts, so they cannot use the in-pod
        unseal path (ADR-019) and await their own decision.
      enum:
        - generic
    AppEventType:
      type: string
      enum:
        - deploy
        - scaling
        - audit
        - error

    # ---- Compute catalogue ----------------------------------------------
    GpuTypeId:
      type: string
      description: >
        Public catalogue code for a supported GPU type (e.g. `h100`, `rtx-pro-6000`).
        Must match an `id` returned by `GET /v1/gpu-types` (validated at request
        time against the catalogue). This is not the internal database row UUID.
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_-]{0,63}$'

    GpuAvailability:
      type: string
      description: Scheduler provisioning availability for this GPU type.
      enum:
        - available
        - reserved
        - custom

    GpuPricing:
      type: object
      additionalProperties: false
      required:
        - id
        - perSecond
        - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"
        effectiveFrom:
          type: string
          format: date-time
          description: From when this price is effective.

    GpuPricingListItem:
      type: object
      additionalProperties: false
      required:
        - pricing
        - immutableFrom
      properties:
        pricing:
          $ref: '#/components/schemas/GpuPricing'
        immutableFrom:
          type: string
          format: date-time
          nullable: true
          description: >
            The instant this price locks (effectiveFrom minus the 7-day minimum
            notice window), while that instant is still in the future — the
            price can still be updated or deleted until then. `null` once that
            instant has passed: the price is permanently locked and can no
            longer be modified or deleted.

    GpuPricingUpdate:
      type: object
      minProperties: 1
      description: >
        Partial update of a scheduled price. Omitted fields are left unchanged. Only a price
        whose current effectiveFrom is still more than 7 days away can be edited. At least one
        field must be supplied.
      additionalProperties: false
      properties:
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"
        effectiveFrom:
          type: string
          format: date-time
          description: From when this price is effective.

    GpuTypeCreatePricing:
      type: object
      additionalProperties: false
      required:
        - perSecond
      properties:
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"

    GpuPricingCreate:
      type: object
      additionalProperties: false
      required:
        - perSecond
        - effectiveFrom
      properties:
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"
        effectiveFrom:
          type: string
          format: date-time
          description: From when this price is effective.

    GpuType:
      type: object
      required:
        - id
        - name
        - memory
        - availability
        - pricing
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            Public catalogue code referenced by `gpuType` in worker configuration
            (not the internal database row UUID).
        name:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          example: H100
        memory:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          description: Human-readable memory capacity.
          example: 80 GB HBM
        availability:
          $ref: '#/components/schemas/GpuAvailability'
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Retirement time, returned only in the Runware catalogue view.
        pricing:
          allOf:
            - $ref: '#/components/schemas/GpuPricing'
          description: >
            The price currently in effect — the most recent price whose
            effectiveFrom is not in the future. The Runware principal can
            read the full price history, including scheduled future
            changes, from `GET /v1/gpu-types/{gpuTypeId}/prices`.

    GpuTypeCreate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - memory
        - availability
        - pricing
        - sortOrder
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            Immutable public catalogue code. Must be unique across the catalogue.
        name:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          example: H100
        memory:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          description: Human-readable memory capacity.
          example: 80 GB HBM
        availability:
          $ref: '#/components/schemas/GpuAvailability'
        pricing:
          $ref: '#/components/schemas/GpuTypeCreatePricing'
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          description: >
            Display / catalogue ordering. Lower values sort first in `GET /v1/gpu-types`.

    GpuTypeUpdate:
      type: object
      minProperties: 1
      description: >
        Partial update of a catalogue entry. Omitted fields are left unchanged. The catalogue
        code itself is immutable and addressed via the path parameter. At least one field must
        be supplied.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
        memory:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
        availability:
          $ref: '#/components/schemas/GpuAvailability'
        sortOrder:
          type: integer
          format: int32
          minimum: 0

    GpuTypeList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GpuType'

    # ---- Pagination --------------------------------------------------------
    Page:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null when there are no more items.

    # ---- Money -------------------------------------------------------------
    Currency:
      type: string
      description: ISO 4217 alphabetic code. The platform bills in USD only.
      enum:
        - USD

    MoneyAmount:
      type: object
      description: >
        A monetary amount as an exact decimal string in the currency's major
        unit. Money is never represented as a float (see `GpuPricing.perSecond`).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: '^\d+\.\d+$'
          description: Amount in major units as an exact decimal string.
          example: "312.40"
        currency:
          $ref: '#/components/schemas/Currency'

    # ---- Core resources ----------------------------------------------------
    AppSummary:
      type: object
      description: >
        Aggregate dashboard metrics for every app in the authenticated
        organisation. App and worker tallies are always present (zero when
        empty). Traffic and spend metrics whose backing system is not yet
        available are omitted (rendered as "no data" by the frontend) rather
        than reported as zero.
      required:
        - totalApps
        - activeApps
        - activeWorkers
        - provisionedGpuCount
        - calculatedAt
      properties:
        activeApps:
          type: integer
          format: int64
          description: Apps currently in the `active` status.
        totalApps:
          type: integer
          format: int64
          description: All apps in the organisation excluding soft-deleted ones.
        activeWorkers:
          type: integer
          format: int64
          description: >
            Non-terminal workers (`status` other than `stopped`) across every
            app in the organisation.
        provisionedGpuCount:
          type: integer
          format: int64
          description: >
            Sum of `gpuCount` across those same non-terminal workers.
        requests24h:
          type: integer
          format: int64
          description: Requests served in the last 24h. Omitted until request metrics are available.
        errorRate24h:
          type: number
          format: double
          description: Error ratio (0–1) over the last 24h. Omitted until request metrics are available.
        spendToday:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: >
            Estimated spend since 00:00 UTC. Omitted until billing rollups are
            available.
        calculatedAt:
          type: string
          format: date-time
          description: When these metrics were computed.

    App:
      type: object
      required:
        - appId
        - appName
        - configuration
        - secrets
        - environmentVariables
        - status
        - isFavourite
        - createdAt
        - updatedAt
      properties:
        appId:
          $ref: '#/components/schemas/AppId'
        appName:
          $ref: '#/components/schemas/AppName'
        configuration:
          allOf:
            - $ref: '#/components/schemas/WorkerConfig'
          description: Live worker configuration. Updated via `PATCH /apps/{appId}`.
        secrets:
          type: array
          description: >
            Secrets attached to this app, including any env-var name
            override. Populated on single-app responses; list of
            apps returns an empty array to avoid an N+1 — use
            `/apps/{appId}/secrets` to page the set.
          items:
            $ref: '#/components/schemas/SecretAttachment'
        environmentVariables:
          type: array
          description: >
            Plain-text environment variables for this app. Populated on
            single-app responses (get, update, stop, resume, delete,
            deploy, favourite). List of apps returns an empty array to
            avoid an N+1 per page row — use the `/environment-variables`
            endpoints to page the set.
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        status:
          $ref: '#/components/schemas/AppStatus'
        isFavourite:
          type: boolean
          description: >
            Whether the authenticated organisation has favourited this app. Drives the
            console Favourites section; toggled via `PUT`/`DELETE`
            `/v1/apps/{appId}/favourite`.
        activeVersionId:
          type: string
          format: uuid
          nullable: true
          description: Current deployed version; null until the first version is successfully deployed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppVolume:
      type: object
      additionalProperties: false
      required:
        - mountPath
      properties:
        mountPath:
          type: string
          minLength: 2
          maxLength: 2048
          pattern: '^/[A-Za-z0-9._/+@-]+$'
          description: >
            Absolute path exposed inside the sandboxed application. The path is the
            volume's stable identity and is mirrored below the app's node-local
            data directory. Root, duplicate, and overlapping paths are rejected.

    AppCreate:
      type: object
      # Unknown fields are rejected rather than ignored: a stale client sending a
      # field that has moved (e.g. the top-level `computeType`, now inside
      # `configuration`) must fail loudly instead of silently getting the default.
      additionalProperties: false
      required:
        - appId
        - appName
        - configuration
        - appSource
      properties:
        appId:
          $ref: '#/components/schemas/AppId'
        appName:
          $ref: '#/components/schemas/AppName'
        configuration:
          $ref: '#/components/schemas/WorkerConfigCreate'
        appSource:
          allOf:
            - $ref: '#/components/schemas/AppSourceUpsert'
          description: >
            Write-only. Source for the app's first version; not returned in the App response.
            Use the `/builds` endpoints to inspect build status.

            - `code`: the codebase is submitted to the build pipeline; a new image is built and
              deployed once ready.

            - `container`: no build step — the version names the image reference supplied here.
              No worker runs from a container source yet, so the app stays `initializing`.

            Either way the version is recorded with the app. A code-source app transitions
            to `active` once its first version is ready, or to `failed` if the build, validation,
            or rollout fails.
        secrets:
          type: array
          description: >
            Existing organisation secrets to attach to this app, with an
            optional env-var name override per entry. Not persisted yet —
            supplying this field returns `422`, rather than accepting a set
            nothing attaches to the workload. Shape matches
            `POST /apps/{appId}/secrets` so create and attach
            share one contract. When wired, each injected name must not collide
            with a key in `environmentVariables` (or an existing
            `deployment_configs` row) — see `SecretAttach`.
          items:
            $ref: '#/components/schemas/SecretAttach'
        environmentVariables:
          type: object
          description: >
            Map with environment variables. Keys are the environment variable names,
            values are the environment variable values. Use the dedicated
            `/environment-variables` endpoints to change them after the app exists.

            Each key must satisfy `EnvironmentVariableName` — POSIX-style, at most 128
            characters. OpenAPI 3.0 cannot constrain map keys, so a bad one is rejected
            by the server rather than by the schema. Keys must also not collide with
            a secret's injected env var name on the same app (see
            `attachAppSecret`).
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 4096
        volumes:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/AppVolume'
          description: >
            Persistent node-local directories bind-mounted through the checkpointer into
            the sandboxed application. Use these for downloaded weights and caches that
            must stay outside the checkpointed root filesystem. Paths must be unique and
            non-overlapping. The set is frozen into each immutable app version.
        endpoints:
          type: array
          description: >
            Invocable routes to expose on the app. Paths are unique within an
            app: repeating one in this array is rejected rather than collapsed,
            since there would be no answer to which entry a request meant.
          uniqueItems: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/EndpointCreate'

    AppUpdate:
      type: object
      description: >
        Updates one or more aspects of an app in place. All fields are optional;
        omitted fields are left unchanged. Lifecycle transitions (stop/resume/delete/deploy)
        use their dedicated operations.

        A successful update records a new version carrying the updated configuration and the
        same image, so what to deploy is always a version rather than the current state of a
        mutable row. `activeVersionId` does not move: the running workload is unchanged until
        that version is deployed.

        **Currently applied:** `appName` and `configuration`. Supplying
        `appSource`, `secrets`, `environmentVariables`, or `endpoints` returns `422`
        (bulk env-var replace is not wired — use the dedicated `/environment-variables`
        endpoints for individual keys). When wired, configuration/secret/endpoint changes
        take effect on the next Scaler cycle; `appSource` triggers a new build and
        rollout.
      additionalProperties: false
      properties:
        appName:
          allOf:
            - $ref: '#/components/schemas/AppName'
          description: >
            Mutable display name; does not affect app identity or routing.
            Omit to leave unchanged — an explicit blank value is rejected, not
            treated as a clear.
        configuration:
          $ref: '#/components/schemas/WorkerConfigPatch'
        appSource:
          allOf:
            - $ref: '#/components/schemas/AppSourceUpsert'
          description: >
            Write-only. New source to build and deploy; not returned in the App response.
            Use the `/builds` endpoints to inspect build status. Triggers a build (for `code`
            sources) or image validation (for `container` sources); on success the resulting
            version is deployed automatically. On failure the app remains on the previous
            version. Not persisted yet — supplying this field returns `422`.
        secrets:
          type: array
          description: >
            Replaces the app's secret attachments. Same `SecretAttach`
            shape as create and
            `POST /apps/{appId}/secrets`. Not persisted yet —
            supplying this field returns `422`. When wired, injected names must
            not collide with plain environment variables on the app.
          items:
            $ref: '#/components/schemas/SecretAttach'
        environmentVariables:
          type: object
          description: >
            Map with environment variables. Keys are the environment variable names, values
            are the environment variable values. Setting the value of an environment variable
            to null deletes the environment variable from the app. Not persisted yet —
            supplying this field returns `422`.
          additionalProperties:
            type: string
            nullable: true
        endpoints:
          type: array
          description: >
            Replaces the app's endpoints. Not persisted yet — supplying this field
            returns `422`.
          items:
            $ref: '#/components/schemas/EndpointCreate'

    WorkerConfig:
      type: object
      required:
        - id
        - appId
        - computeType
        - gpusPerWorker
        - minWorkers
        - maxWorkers
        - idleTtlSecs
        - scalingDelaySecs
        - concurrency
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        computeType:
          $ref: '#/components/schemas/ComputeType'
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
          description: >
            Preferred GPU type. Absent (or null) only on historical
            apps created before a GPU type was required.
        fallbackGpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
          description: Secondary GPU type used if the preferred type is unavailable.
        gpusPerWorker:
          type: integer
          format: int32
          default: 1
        minWorkers:
          type: integer
          format: int32
          default: 0
          minimum: 0
          description: Floor for scale-down; 0 = scale to zero.
        maxWorkers:
          type: integer
          format: int32
          minimum: 1
        minAvailableWorkers:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: Minimum number of available (idle) workers kept as a pre-emptive buffer.
        availableWorkersPct:
          type: integer
          format: int32
          nullable: true
          description: Scaling buffer as a percentage of incoming task load.
        idleTtlSecs:
          type: integer
          format: int32
          description: Seconds a worker can sit idle before the Scaler removes it.
        scalingDelaySecs:
          type: integer
          format: int32
          description: Cooldown between consecutive scaling decisions.
        concurrency:
          type: integer
          format: int32
          default: 1
          description: Max tasks a single worker handles simultaneously.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkerConfigCreate:
      type: object
      additionalProperties: false
      required:
        - gpuType
        - maxWorkers
        - idleTtlSecs
        - scalingDelaySecs
      properties:
        computeType:
          allOf:
            - $ref: '#/components/schemas/ComputeType'
          default: 'gpu'
          description: >
            GPU is the only supported compute type. Omitting the field selects
            GPU. CPU workloads are not supported; a request that names `cpu` is
            rejected with 422 before a build or deploy starts.
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            GPU type the workers run on. Required: omitting it (or sending
            null) is a 422 before a build or deploy starts, because a GPU
            app with no type is unpinned and the deployer would render
            NVIDIA defaults. Must match an `id` returned by `GET /v1/gpu-types`
            that currently has admitted capacity.
        fallbackGpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
        gpusPerWorker:
          type: integer
          format: int32
          minimum: 0
          default: 1
        minWorkers:
          type: integer
          format: int32
          minimum: 0
          default: 0
        maxWorkers:
          type: integer
          format: int32
          minimum: 1
        minAvailableWorkers:
          type: integer
          format: int32
          minimum: 0
          nullable: true
        availableWorkersPct:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
        idleTtlSecs:
          type: integer
          format: int32
          minimum: 1
        scalingDelaySecs:
          type: integer
          format: int32
          minimum: 1
        concurrency:
          type: integer
          format: int32
          minimum: 1
          default: 1

    WorkerConfigPatch:
      type: object
      description: >
        Partial worker configuration. Any field present overwrites the live value; omitted
        fields are left unchanged. Clearing a nullable live field (setting it to null) is not
        supported — omit the field to leave it unchanged. `computeType` is create-time only and
        cannot be patched. Changing `gpuType` or `gpusPerWorker` affects only newly created workers.
      additionalProperties: false
      properties:
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            Preferred GPU type. Omit to leave unchanged. Rejected with a 422
            when no capacity is currently offered for the type (it does not
            appear in `GET /v1/gpu-types`).
        fallbackGpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: Secondary GPU type. Omit to leave unchanged.
        gpusPerWorker:
          type: integer
          format: int32
          minimum: 0
        minWorkers:
          type: integer
          format: int32
          minimum: 0
        maxWorkers:
          type: integer
          format: int32
          minimum: 1
        minAvailableWorkers:
          type: integer
          format: int32
          minimum: 0
          description: Pre-emptive idle-worker buffer. Omit to leave unchanged.
        availableWorkersPct:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Scaling buffer as a percentage of load. Omit to leave unchanged.
        idleTtlSecs:
          type: integer
          format: int32
          minimum: 1
        scalingDelaySecs:
          type: integer
          format: int32
          minimum: 1
        concurrency:
          type: integer
          format: int32
          minimum: 1

    Version:
      type: object
      description: >
        An immutable record of what to deploy. One is created with the app and one on
        every update, so a rollout always names a version rather than reading configuration
        that may since have changed.
      required:
        - id
        - appId
        - versionNumber
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        versionNumber:
          type: integer
          format: int32
          description: Monotonically increasing per app.
        buildId:
          type: string
          format: uuid
          nullable: true
          description: >
            The build that produced this version's image. Null for a `container` source,
            which names an image the customer already built and so has no build. A version
            created by an update carries the image, and therefore this build, forward.
        createdAt:
          type: string
          format: date-time

    Build:
      type: object
      description: Details of a code build or container validation.
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BuildStatus"
        error:
          type: string
          nullable: true
          description: Error message or failure reason; null when the build is still running or succeeded.
        exitCode:
          type: integer
          format: int32
          nullable: true
        logTail:
          type: string
          nullable: true
          description: Trailing build log output.
        createdAt:
          type: string
          format: date-time

    ContainerSource:
      type: object
      required:
        - imageRef
      properties:
        imageRef:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^\S+$'
          description: Registry URI of a pre-built image, e.g. `ghcr.io/acme/model:v2`.
        registrySecretName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 253
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
          description: >
            Pull-credential name for a private image registry. Omit for a public
            registry. Parked on the version until image-pull custody has its own
            ADR — it is not a `secrets` row (ADR-019 covers only env-var secrets
            unsealed in-pod; the kubelet needs the credential before any
            container starts).

            When wired, the name becomes a Kubernetes Secret name, so it must be
            a DNS-1123 subdomain: lower-case alphanumerics, `-` and `.`, starting
            and ending alphanumeric, at most 253 characters. That is a hard
            requirement of what the name is used for, not a Runware naming policy.

    CodebaseSource:
      type: object
      required:
        - zipBase64
        - modelFile
      properties:
        zipBase64:
          type: string
          description: >
            Base64-encoded zip archive of the customer's code.
            Note: move to presigned URL upload for production — base64 bloats the request body for large codebases.
        modelFile:
          type: string
          description: Path within the zip to the MLflow model entry point (e.g. `model.py`).

    AppSourceUpsert:
      type: object
      required:
        - type
        - source
      properties:
        type:
          type: string
          enum: [code, container]
          description: >
            Selects the version creation path. `code` submits customer source code to
            the Image Build Service; `container` references a pre-built OCI image.
        source:
          oneOf:
            - $ref: '#/components/schemas/CodeSourceUpsert'
            - $ref: '#/components/schemas/ContainerSource'

    CodeSourceUpsert:
      type: object
      required:
        - baseImage
        - codebase
      properties:
        baseImage:
          type: string
          description: Base image for the builder, e.g. `python:3.11-slim`.
        requirements:
          type: array
          items:
            type: string
          description: Additional pip packages to install alongside the codebase.
        codebase:
          $ref: '#/components/schemas/CodebaseSource'

    DeployRequest:
      type: object
      required:
        - versionNumber
      properties:
        versionNumber:
          type: integer
          format: int32
          description: >
            Version number to deploy. Must reference a `ready` version on this app.
            Any in-progress or queued builds are cancelled. Use an older version number to roll back.

    Endpoint:
      type: object
      required:
        - id
        - appId
        - path
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        path:
          type: string
          description: >
            The endpoint's identity within the app: a bare lowercase URL
            segment, e.g. `generate`, with no leading slash. Unique within the
            app, so it identifies the endpoint on its own.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EndpointCreate:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z]([a-z0-9-]{0,62}[a-z0-9])?$'
          description: >
            The endpoint's identity within the app: a bare lowercase URL
            segment, e.g. `generate` — a letter first, then letters, digits and
            hyphens, ending with a letter or digit, max 64 characters. No leading
            slash: documentation may display `/generate`, but the stored and
            addressed form is `generate`, so it drops into the invocation URL with
            no encoding. Unique within the app. All invocations are POST;
            the HTTP method is not part of endpoint identity.

    Worker:
      type: object
      description: >
        A worker instance observed from Kubernetes. Read-only runtime state written
        by the reconciler; `id` is the pod UID.
      required:
        - id
        - appId
        - versionId
        - podName
        - status
        - gpuCount
        - statusOccurredAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        versionId:
          type: string
          format: uuid
        podName:
          type: string
        nodeName:
          type: string
          nullable: true
          description: Kubernetes node the pod is scheduled on. Omitted while still pending.
        status:
          $ref: '#/components/schemas/WorkerStatus'
        statusReason:
          type: string
          nullable: true
          description: >
            Kubernetes-facing reason for the current status when unhealthy or otherwise
            notable (e.g. `ImagePullBackOff`, `CrashLoopBackOff`).
        statusOccurredAt:
          type: string
          format: date-time
          description: When the worker entered its current status.
        gpuCount:
          type: integer
          format: int32
          minimum: 0
          description: GPUs attached to this worker at observation time.
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
          description: GPU catalogue code snapshotted at observation time; omitted for CPU workers.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Worker-reported liveness. Omitted until the worker reports; stays
            absent until a heartbeat path exists (phase 2).
        createdAt:
          type: string
          format: date-time
          description: Pod creation time (`metadata.creationTimestamp`), not insert time.
        updatedAt:
          type: string
          format: date-time

    Secret:
      type: object
      description: Secret metadata. The encrypted value is never returned.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/SecretName'
        type:
          $ref: '#/components/schemas/SecretType'
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional opaque metadata associated with the secret.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SecretAttachment:
      description: >
        A secret attached to an app. The encrypted value is never returned.
        The database always stores the injected env var name; this response omits
        `envVarName` when it equals the secret `name` (no override).
      allOf:
        - $ref: '#/components/schemas/Secret'
        - type: object
          properties:
            envVarName:
              type: string
              allOf:
                - $ref: '#/components/schemas/EnvironmentVariableName'
              nullable: true
              description: >
                Resolved environment variable name when it differs from `name`.
                Omitted when the secret name is used. Same reserved-name rules
                as `SecretName` when set.

    SecretAttach:
      type: object
      description: >
        Attach an organisation secret to an app (control-plane record
        only in this release). The resolved name (`envVarName`, or `secretName`
        when omitted) is stored as one NOT NULL column. It must be unique among
        this app's secret attaches and must not collide with a plain
        environment variable key on the same app — both names are
        reserved for the same future pod env namespace. Reserved platform names
        are rejected as on `SecretName`.
      required:
        - secretName
      properties:
        secretName:
          $ref: '#/components/schemas/SecretName'
        envVarName:
          type: string
          allOf:
            - $ref: '#/components/schemas/EnvironmentVariableName'
          nullable: true
          description: >
            Environment variable name to use when the secret is eventually
            injected. Omit or null to use `secretName`; the server resolves and
            stores the final name. Same reserved-name rules as `SecretName`
            (`422` if reserved). The resolved name must also not collide with
            `deployment_configs.key` on this app (`422`).

    SecretCreate:
      type: object
      required:
        - name
        - type
        - value
      properties:
        name:
          $ref: '#/components/schemas/SecretName'
        type:
          $ref: '#/components/schemas/SecretType'
        value:
          type: string
          maxLength: 65536
          description: >
            Plain-text value; encrypted at rest by the platform. Capped at 64 KiB
            — Cloud KMS Encrypt's plaintext ceiling, and the reason the design
            needs no envelope encryption (ADR-019).

            `maxLength` is OpenAPI's string-length bound (character count), not
            a byte limit. Cloud KMS measures UTF-8 bytes, so the server also
            rejects a value whose UTF-8 encoding exceeds 65536 bytes with
            `422` — a rule this schema cannot express alone (multi-byte
            characters can pass `maxLength` and still overrun the KMS limit).
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    SecretUpdate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          maxLength: 65536
          description: >
            Plain-text value; encrypted at rest by the platform. Same 64 KiB
            Cloud KMS plaintext ceiling and UTF-8 byte check as
            `SecretCreate.value`.
        metadata:
          type: object
          additionalProperties: true
          description: >
            Omit to leave the stored metadata unchanged. Send an object
            (including `{}`) to replace it.

    EnvironmentVariable:
      type: object
      required:
        - key
        - value
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        key:
          $ref: '#/components/schemas/EnvironmentVariableName'
        value:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnvironmentVariableUpdate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          maxLength: 4096
          description: >
            Value delivered to the workload as this variable's value. Bounded because
            every variable ends up in the pod template, which as a whole has to fit
            what the Kubernetes API server accepts — the same `maxLength` create
            applies, so one path cannot be used to exceed the other.

    Task:
      type: object
      required:
        - id
        - status
        - appId
        - createdAt
      properties:
        id:
          type: string
          description: Opaque task identifier returned by the execution backend.
        status:
          $ref: '#/components/schemas/TaskStatus'
        appId:
          $ref: '#/components/schemas/AppId'
        output:
          type: object
          additionalProperties: true
          nullable: true
          description: Inference result payload on success; null otherwise.
        error:
          type: string
          nullable: true
          description: Failure detail when status is `failed`; null otherwise.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    UsageEvent:
      type: object
      required:
        - id
        - appId
        - workerId
        - eventType
        - gpuCount
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        workerId:
          type: string
          format: uuid
        eventType:
          # allOf so the description is not a sibling of $ref (ignored in OAS 3.0).
          allOf:
            - $ref: '#/components/schemas/WorkerStatus'
          description: >
            Status the worker transitioned into. The ledger emits a subset of
            `WorkerStatus` — `busy` never appears (queue occupancy, not a pod
            lifecycle transition).
        gpuCount:
          type: integer
          format: int32
        occurredAt:
          type: string
          format: date-time
          description: >
            When the transition happened. This is the event time the `from` and
            `to` filters apply to, and the field to bill on.
        createdAt:
          type: string
          format: date-time
          description: When the event was recorded. Audit only — may lag `occurredAt`.

    AppEvent:
      type: object
      required:
        - id
        - appId
        - type
        - message
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        workerId:
          type: string
          format: uuid
          nullable: true
        endpointId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/AppEventType'
        message:
          type: string
          pattern: '\S'
          description: Human-readable description of what happened. Never blank.
        createdAt:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: >
        RFC 9457 problem details. Every error response from this API uses this
        schema with media type `application/problem+json`. `type` is a URI that
        identifies the problem class and dereferences to its documentation;
        clients should switch on `type` (not `status` or `detail`, which are not
        stable identifiers). Additional members beyond those below may appear.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: >
            URI reference identifying the problem type. Dereferences to
            human-readable documentation. `about:blank` denotes "no semantics
            beyond the HTTP status".
          example: https://docs.runware.ai/serverless/errors#not-found
        title:
          type: string
          description: >
            Short, human-readable summary of the problem type (the standard HTTP
            status text). Stable for a given `type`; does not change from
            occurrence to occurrence.
          example: Not Found
        status:
          type: integer
          format: int32
          description: HTTP status code generated for this occurrence.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: No app 'img-gen' exists for the authenticated organisation.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence (the request path).
          example: /v1/apps/img-gen
        requestId:
          type: string
          description: >
            Extension member. Correlation id for this request, echoed in the
            `X-Request-Id` response header; quote it when reporting problems.
        taskId:
          type: string
          description: >
            Extension member. Present on synchronous inference timeouts when the
            accepted task can be polled for its eventual result.
        endpointPath:
          type: string
          description: >
            Extension member. Present on a `404` from task invocation when the
            app exists but does not declare the requested endpoint path;
            its presence distinguishes an unknown endpoint from an unknown
            app. Carries the rejected path.
          example: generate
        errors:
          type: array
          description: >
            Extension member. Present on validation failures (`422`); one entry
            per offending request field.
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      type: object
      description: A single field-level validation error within a ProblemDetails.
      required:
        - detail
      properties:
        detail:
          type: string
          description: Human-readable reason this field was rejected.
          example: is required
        pointer:
          type: string
          description: >
            JSON Pointer (RFC 6901) to the offending field in the request body,
            e.g. `/configuration/maxWorkers`. Absent for non-body parameters.
          example: /configuration/maxWorkers