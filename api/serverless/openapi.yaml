  # ---------------------------------------------------------------------------
  # Insights: customer-facing metrics and logs
  #
  # No path here names a tenant. The organization comes from the authenticated
  # credential and nothing else, and it is what the stores are read under, so a caller
  # cannot ask for another organization's data by naming it.
  #
  # Nothing on these routes accepts a query expression or a label matcher. A caller
  # names a query from the catalogue and narrows it with selectors from a closed set;
  # how that becomes a read is decided downstream (ADR-023).
  # ---------------------------------------------------------------------------
  /v1/metrics/queries:
    get:
      tags:
        - Observability
      summary: List the metric and log queries this build can answer
      description: >
        The catalogue: every named query, its unit and aggregation, the selectors it
        accepts, the series it returns, and the windows actually backed by stored series.


        This is the source of query ids. Clients discover ids here rather than carrying a
        list of their own, and render window tabs from `windows` rather than from the full
        ladder, so a window whose storage tier has no backing series stays invisible
        instead of rendering a tab with nothing behind it.
      operationId: listInsightsQueries
      responses:
        '200':
          description: The catalogue for this build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryCatalogue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/metrics/queries/{queryId}/series:
    get:
      tags:
        - Observability
      summary: Read one named metric query
      description: >
        Returns one chart's data: a single timestamp axis shared by every series, and one
        dense value array per series aligned to it.


        Values are dense and positionally aligned to `t`, with an explicit `null` wherever
        there was no sample. Each timestamp is the END of its bucket, so `window.to` is
        inclusive and equals the last timestamp in `t`, while `window.from` is exclusive
        and is one `step_s` before the first.


        An organization with no metrics yet is answered with the full axis and all-null
        series rather than an error.


        `apps_request_volume` returns one series per app: 24 hourly request counts over
        `window=24h` (`step_s` 3600, unit `requests`). Repeat `appId` once per id on the
        current list page to pad idle apps with all-null series, in request order. Hours
        that started before that live app's `createdAt` are null, so a reused app id does
        not inherit the previous generation's traffic still in the 24h store. The same
        `appId` pad applies to the list-scoped `apps_error_volume` and
        `apps_request_duration` queries. Other queries reject `appId`. Other windows
        are not available for these queries.


        `endpoints_request_volume` is the endpoints-list counterpart: 24 hourly request
        counts per endpoint over `window=24h` (`step_s` 3600, unit `requests`). It
        requires `deployment` (the public app id, rewritten to the live deployment
        UUID). Repeat `endpointId` once per id on the current `listEndpoints` page to
        pad idle endpoints with all-null series, in request order. Hours that started
        before that endpoint row's `createdAt` are null, so a removed-then-readded path
        does not inherit the previous row's traffic. Other queries reject `endpointId`.
        Other windows are not available for this query.
      operationId: getMetricSeries
      parameters:
        - $ref: '#/components/parameters/QueryId'
        - $ref: '#/components/parameters/MetricWindow'
        - $ref: '#/components/parameters/PinnedTo'
        - $ref: '#/components/parameters/SelectorDeployment'
        - $ref: '#/components/parameters/SelectorEndpoint'
        - $ref: '#/components/parameters/SelectorStatusClass'
        - $ref: '#/components/parameters/SelectorRegion'
        - $ref: '#/components/parameters/SeriesAppId'
        - $ref: '#/components/parameters/SeriesEndpointId'
      responses:
        '200':
          description: One chart's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/logs/queries/{queryId}/entries:
    get:
      tags:
        - Observability
      summary: Read one page of a named log query
      description: >
        Returns one page of log entries, newest first, with an opaque cursor for the next
        page when one exists.


        No query is registered yet: live tail, retention tiers and log quotas are decided
        in a follow-up ADR, so every request currently answers `404`. The route exists so
        the contract is fixed before the templates land.
      operationId: getLogEntries
      parameters:
        - $ref: '#/components/parameters/QueryId'
        - $ref: '#/components/parameters/MetricWindow'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SelectorDeployment'
        - $ref: '#/components/parameters/SelectorEndpoint'
      responses:
        '200':
          description: One page of log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: >
        Runware API key supplied as a bearer token. Validated server-to-server against the
        existing Runware platform; the key identifies the organisation.
    OrgJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Org-scoped JWT supplied as a bearer token, minted by the Runware platform for one
        user acting in one organisation and verified locally against the platform's
        published JWKS. Serves the web app; the CLI and SDK use ApiKeyAuth.

  parameters:
    AppId:
      name: appId
      in: path
      required: true
      description: >
        Immutable app identifier, unique among the authenticated organisation's live apps.
      schema:
        $ref: '#/components/schemas/AppId'
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Source artifact identifier.
      schema:
        $ref: '#/components/schemas/SourceId'
    SourceUploadId:
      name: uploadId
      in: path
      required: true
      description: Source upload session identifier.
      schema:
        $ref: '#/components/schemas/SourceUploadId'
    GpuTypeId:
      name: gpuTypeId
      in: path
      required: true
      description: Public catalogue code for a GPU type (e.g. `h100`), not the internal row UUID.
      schema:
        $ref: '#/components/schemas/GpuTypeId'
    WorkerId:
      name: workerId
      in: path
      required: true
      description: >
        Worker identifier — the Kubernetes pod UID recorded by the reconciler. This is the
        stable key to address a worker with; `podName` is the value to show a person.
      schema:
        type: string
        format: uuid
    EndpointPath:
      name: endpointPath
      in: path
      required: true
      description: >
        Path of the endpoint to route the task to, as returned by `listEndpoints`:
        a bare lowercase segment such as `generate`, with no leading slash.
      schema:
        $ref: '#/components/schemas/EndpointPath'
    SecretName:
      name: secretName
      in: path
      required: true
      description: Secret name, unique within the authenticated organisation.
      schema:
        $ref: '#/components/schemas/SecretName'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned as `nextCursor` by a previous call.
      schema:
        type: string

    QueryId:
      name: queryId
      in: path
      required: true
      description: >
        A query id from the catalogue. Deliberately not an enum: the downstream registry is
        the source of ids, and an enum here would be a second list to keep in step with it.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,63}$'
    MetricWindow:
      name: window
      in: query
      required: true
      description: >
        The time window. A closed set rather than a free-form range, because every distinct
        range defeats the server-side cache alignment that makes a sliding window cheap.
        Only the windows a query lists in the catalogue can be asked of it.
      schema:
        type: string
        enum: [1h, 6h, 24h, 7d, 30d]
    PinnedTo:
      name: pinnedTo
      in: query
      required: false
      description: >
        Fixes the window's inclusive end, the last timestamp in `t`, so that several calls
        making up one visual share an axis instead of racing the clock between them. Must
        be aligned to the window's step, no newer than the newest readable edge, and inside
        retention.
      schema:
        type: integer
        format: int64
    SelectorDeployment:
      name: deployment
      in: query
      required: false
      description: Narrow to one app.
      schema:
        $ref: '#/components/schemas/AppId'
    SelectorEndpoint:
      name: endpoint
      in: query
      required: false
      description: >
        Narrow to one endpoint within a deployment. The value is the allocated
        `endpoints.id` (UUID), never the customer-authored path. A query that
        does not declare this selector rejects it rather than ignoring it.
      schema:
        type: string
        format: uuid
    SelectorStatusClass:
      name: statusClass
      in: query
      required: false
      description: Narrow to one response class.
      schema:
        type: string
        enum: ['2xx', '4xx', '5xx']
    SelectorRegion:
      name: region
      in: query
      required: false
      description: >
        Narrow to one region. No series carries a region label yet, so no query currently
        accepts this and supplying it is rejected rather than ignored.
      schema:
        type: string
        pattern: '^[a-z0-9_-]{1,32}$'
    SeriesAppId:
      name: appId
      in: query
      required: false
      style: form
      explode: true
      description: >
        Restrict expand-by-`app_id` queries (`apps_request_volume`,
        `apps_error_volume`, `apps_request_duration`) to these app ids: one series
        per id, in request order, with all-null series for apps that had no samples.
        Values are hourly over `window=24h`. Hours that started before that live
        app's `createdAt` are null. Repeat the parameter once per id on the current
        list page (at most 100, matching `listApps`). Omit it to receive every app
        in the organisation that had data, unless that set is larger than this
        query will expand: then the call is a `422` on `appId` and the list page
        should name the apps it is showing. Other queries reject this parameter.
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/AppId'
    SeriesEndpointId:
      name: endpointId
      in: query
      required: false
      style: form
      explode: true
      description: >
        Restrict `endpoints_request_volume` to these endpoint ids: one series per id,
        in request order, with all-null series for endpoints that had no traffic.
        Values are hourly request counts over `window=24h`. Hours that started
        before that endpoint row's `createdAt` are null. Repeat the parameter once
        per id on the current list page (at most 100, matching `listEndpoints`).
        Omit it to receive every endpoint on the selected app that had data, unless
        that set is larger than this query will expand: then the call is a `422`
        on `endpointId` and the list page should name the endpoints it is showing.
        Other queries reject this parameter. Requires `deployment`.
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid
  requestBodies:
    TaskInvocation:
      required: true
      description: >
        The invocation envelope. `taskId` is the client's own identifier for this
        task and `payload` is the body the endpoint's handler receives.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskInvocation'

  responses:
    Task:
      description: The task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Task'
    TaskAccepted:
      description: >
        Task accepted. Normally `pending`, but a resubmitted task id is answered
        with the task it already names, which may have finished — read `status`
        rather than assuming.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Task'
    BadRequest:
      description: >
        The request was malformed and could not be parsed (e.g. invalid JSON).
        A well-formed request that fails validation returns `422` instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: A required service is temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Authenticated but not permitted to access this resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Resource already exists or the request conflicts with its current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: >
        The request was well-formed but semantically invalid (e.g. a missing or
        out-of-range field). A request that could not be parsed returns `400`.
        The `errors` array carries one entry per offending field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: >
        The organization's read allowance is exhausted. `Retry-After` says how long to wait;
        a client that ignores it will keep being refused.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          required: true
          schema:
            type: integer
            format: int32
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadGateway:
      description: An upstream service was unreachable or refused the request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    GatewayTimeout:
      description: An upstream service did not answer in time
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    AppId:
      type: string
      description: >
        Immutable app identifier. Unique among the authenticated organisation's live apps:
        it cannot be changed after creation, and it becomes available again once the app it
        named reaches `deleted`.
      minLength: 6
      maxLength: 30
      pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'

    SourceUploadId:
      type: string
      format: uuid

    SourceId:
      type: string
      format: uuid

    AppSourceType:
      type: string
      enum: [code, container]
      x-enum-varnames:
        - Code
        - Container

    SourceUploadState:
      type: string
      enum: [pending, ready, rejected, expired, deleted]
      x-enum-varnames:
        - SourceUploadStatePending
        - SourceUploadStateReady
        - SourceUploadStateRejected
        - SourceUploadStateExpired
        - SourceUploadStateDeleted

    SourceUploadCreate:
      type: object
      additionalProperties: false
      required:
        - declaredByteLength
        - idempotencyKey
        - sha256
        - sourceType
      properties:
        declaredByteLength:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: Exact archive size in bytes with a 10 MiB MVP limit.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^\S+$'
          description: Client-generated key used to make session creation safe to retry.
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase SHA-256 digest of the complete archive.
        sourceType:
          $ref: '#/components/schemas/AppSourceType'

    SourceUpload:
      type: object
      additionalProperties: false
      required:
        - id
        - declaredByteLength
        - sha256
        - sourceType
        - state
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/SourceUploadId'
        sourceId:
          type: string
          allOf:
            - $ref: '#/components/schemas/SourceId'
          nullable: true
          description: >
            The immutable source this upload published. Set once the upload is `ready`; it
            is what app create and source update name. Equal to `id`, so a retry of
            completion returns the same value.
        declaredByteLength:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sourceType:
          $ref: '#/components/schemas/AppSourceType'
        state:
          $ref: '#/components/schemas/SourceUploadState'
        rejectionReason:
          type: string
          nullable: true
          description: Reason completion rejected the archive, when state is `rejected`.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SourceUploadTransfer:
      oneOf:
        - $ref: '#/components/schemas/SourceUploadSinglePutTransfer'
      discriminator:
        propertyName: mode
        mapping:
          singlePut: '#/components/schemas/SourceUploadSinglePutTransfer'

    SourceUploadSinglePutTransfer:
      type: object
      additionalProperties: false
      required:
        - mode
        - method
        - url
        - headers
        - expiresAt
      properties:
        mode:
          type: string
          enum: [singlePut]
          x-enum-varnames:
            - SourceUploadTransferModeSinglePut
        method:
          type: string
          enum: [PUT]
          x-enum-varnames:
            - SourceUploadTransferMethodPut
        url:
          type: string
          format: uri
          description: Short-lived URL for this upload's exact staging object.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the client must include in the upload request.
        expiresAt:
          type: string
          format: date-time
          description: Time after which the transfer instruction is no longer valid.

    SourceUploadCreation:
      type: object
      additionalProperties: false
      required:
        - upload
        - transfer
      properties:
        upload:
          $ref: '#/components/schemas/SourceUpload'
        transfer:
          $ref: '#/components/schemas/SourceUploadTransfer'

    Source:
      type: object
      additionalProperties: false
      description: >
        An immutable source artifact: the archive a completed upload published, with the
        facts upload completion verified it under. It names no app, version, or entry point,
        so any number of versions across the organization's apps may reference it.
      required:
        - id
        - sourceType
        - byteLength
        - sha256
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        sourceType:
          $ref: '#/components/schemas/AppSourceType'
        byteLength:
          type: integer
          format: int64
          minimum: 1
          description: Verified length of the archive in bytes.
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Verified lowercase SHA-256 digest of the archive.
        createdAt:
          type: string
          format: date-time

    EndpointPath:
      type: string
      description: >
        Path of the endpoint to route the task to: a bare lowercase segment such
        as `generate`, with no leading slash.
      minLength: 1
      maxLength: 64
      pattern: '^[a-z]([a-z0-9-]{0,62}[a-z0-9])?$'

    AppName:
      type: string
      description: >
        Mutable display name. Must contain at least one non-whitespace character:
        it is what the console renders and what `sort=name` orders on, and it is
        not required to be unique. Unlike `appId` the pattern is
        unanchored, so interior spaces are allowed — only an entirely blank name
        is rejected.
      minLength: 1
      pattern: '\S'

    EnvironmentVariableName:
      type: string
      description: >
        POSIX-style environment variable name. Letters, digits, and underscore;
        must start with a letter or underscore. Matched by the
        `deployment_configs` column CHECK so a valid-by-contract request cannot
        500 at INSERT.
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'

    SecretName:
      type: string
      description: >
        Organisation-scoped secret name. The shape matches
        `EnvironmentVariableName` and the `secrets.name` /
        `deployment_secrets.env_var_name` column CHECKs — one rule for the
        contract and the schema — because attached secrets are intended to be
        injected as environment variables once ADR-019 in-pod unseal lands.

        Names the platform sets on the serving container (`RUNTIME`,
        `DISABLE_NGINX`, `MLFLOW_MODELS_WORKERS`, `UVICORN_HOST`) are rejected
        with `422`: when injection exists, the deployer appends customer env
        after its own and kubelet resolves duplicates last-wins, so an accepted
        collision would silently replace a platform value. Same guard as plain
        environment variables; enforced by the server (not expressible as a
        pattern here).
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'

    # ---- Enums -------------------------------------------------------------
    AppStatus:
      type: string
      enum:
        - initializing
        - active
        - stopping
        - stopped
        - deleting
        - deleted
        - failed
    AppSort:
      type: string
      description: >
        Ordering for `listApps`. Favourited apps appear before non-favourited apps, and the
        selected ordering applies within each group. Every ordering is total (ties broken by
        `appId`), so a page is reproducible and its cursor stable.


        - `createdAt`: newest first. The default.

        - `name`: `appName` A–Z, case-insensitive.

        - `activity`: most recently active first.

        - `errorRate`: highest error rate first.


        `activity` and `errorRate` rank on per-app traffic metrics, which are not
        collected yet; requesting either returns `422` until they are.
      default: createdAt
      enum:
        - createdAt
        - name
        - activity
        - errorRate
    BuildStatus:
      type: string
      description: Build/validation lifecycle status.
      enum:
        - queued
        - building
        - ready
        - failed
        - superseded
    ComputeType:
      type: string
      description: >
        Worker compute class. GPU is the only supported value. CPU workloads
        are not supported.
      enum:
        - gpu
    WorkerStatus:
      type: string
      description: >
        Worker lifecycle status. Also the type of `UsageEvent.eventType`, which
        records a ledger subset of these states (see that field — `busy` never
        appears there). `unhealthy` means the pod exists but failed to become
        or stay ready, not an intentional drain or stop.
      enum:
        - pending
        - pulling
        - loading
        - ready
        - busy
        - unhealthy
        - draining
        - stopping
        - stopped
      # Pins the generated Go constant names. Without it, oapi-codegen prefixes
      # an enum's constants only while some *other* enum shares a value with it,
      # so adding an unrelated enum elsewhere in this spec silently renames all
      # of these — which is exactly how WorkerStatusReady once became a bare
      # Ready when new enums absorbed the conflicts that had forced the prefix.
      x-enum-varnames:
        - WorkerStatusPending
        - WorkerStatusPulling
        - WorkerStatusLoading
        - WorkerStatusReady
        - WorkerStatusBusy
        - WorkerStatusUnhealthy
        - WorkerStatusDraining
        - WorkerStatusStopping
        - WorkerStatusStopped
    WorkerStateFilter:
      type: string
      description: >
        Which worker states a page covers. `live` is every status other than
        `stopped`, so it is the page a dashboard wants and the one `status`
        alone can only ask for one value at a time. `all` includes the terminal
        rows that are kept as history.
      enum:
        - live
        - all
      # oapi-codegen names an enum member after its value alone and prefixes the
      # type only where two members collide, so `live` and `all` would generate
      # as package-scope `Live` and `All`. Both read as belonging to nothing, and
      # the next enum with a member of either name renames these two under the
      # generator's own collision rule. Naming them here is the same spelling
      # every other enum in this spec ends up with.
      x-enum-varnames:
        - WorkerStateFilterLive
        - WorkerStateFilterAll
      default: all
    TaskStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
    SecretType:
      type: string
      description: >
        Kind of secret. Only the environment-variable variant (`generic`) is
        supported. Image-pull (`registry`) credentials are consumed by the
        kubelet before any container starts, so they cannot use the in-pod
        unseal path (ADR-019) and await their own decision.
      enum:
        - generic
    AppEventType:
      type: string
      enum:
        - deploy
        - scaling
        - audit
        - error

    # ---- Compute catalogue ----------------------------------------------
    GpuTypeId:
      type: string
      description: >
        Public catalogue code for a supported GPU type (e.g. `h100`, `rtx-pro-6000`).
        Must match an `id` returned by `GET /v1/gpu-types` (validated at request
        time against the catalogue). This is not the internal database row UUID.
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_-]{0,63}$'

    GpuTypeIdOrEmpty:
      type: string
      description: >
        A `GpuTypeId`, or the empty string. Optional fallback GPU fields accept
        `""` because forms bind an unselected dropdown as empty rather than
        omitting the key. A non-empty value has the same shape as `GpuTypeId` —
        keep this pattern aligned when the catalogue-code format changes.
      maxLength: 64
      pattern: '^$|^[a-z][a-z0-9_-]{0,63}$'

    GpuAvailability:
      type: string
      description: Scheduler provisioning availability for this GPU type.
      enum:
        - available
        - reserved
        - custom

    GpuPricing:
      type: object
      additionalProperties: false
      required:
        - id
        - perSecond
        - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"
        effectiveFrom:
          type: string
          format: date-time
          description: From when this price is effective.

    GpuPricingListItem:
      type: object
      additionalProperties: false
      required:
        - pricing
        - immutableFrom
      properties:
        pricing:
          $ref: '#/components/schemas/GpuPricing'
        immutableFrom:
          type: string
          format: date-time
          nullable: true
          description: >
            The instant this price locks (effectiveFrom minus the 7-day minimum
            notice window), while that instant is still in the future — the
            price can still be updated or deleted until then. `null` once that
            instant has passed: the price is permanently locked and can no
            longer be modified or deleted.

    GpuPricingUpdate:
      type: object
      minProperties: 1
      description: >
        Partial update of a scheduled price. Omitted fields are left unchanged. Only a price
        whose current effectiveFrom is still more than 7 days away can be edited. At least one
        field must be supplied.
      additionalProperties: false
      properties:
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"
        effectiveFrom:
          type: string
          format: date-time
          description: From when this price is effective.

    GpuTypeCreatePricing:
      type: object
      additionalProperties: false
      required:
        - perSecond
      properties:
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"

    GpuPricingCreate:
      type: object
      additionalProperties: false
      required:
        - perSecond
        - effectiveFrom
      properties:
        perSecond:
          type: string
          minLength: 1
          pattern: '^\d+\.\d+$'
          description: >
            Price per GPU per second in USD major units as an exact decimal
            string (e.g. "0.000767"). Stored and billed from nanodollars
            internally; the platform bills in USD only.
          example: "0.000767"
        effectiveFrom:
          type: string
          format: date-time
          description: From when this price is effective.

    GpuType:
      type: object
      required:
        - id
        - name
        - memory
        - availability
        - pricing
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            Public catalogue code referenced by `gpuType` in worker configuration
            (not the internal database row UUID).
        name:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          example: H100
        memory:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          description: Human-readable memory capacity.
          example: 80 GB HBM
        availability:
          $ref: '#/components/schemas/GpuAvailability'
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Retirement time, returned only in the Runware catalogue view.
        pricing:
          allOf:
            - $ref: '#/components/schemas/GpuPricing'
          description: >
            The price currently in effect — the most recent price whose
            effectiveFrom is not in the future. The Runware principal can
            read the full price history, including scheduled future
            changes, from `GET /v1/gpu-types/{gpuTypeId}/prices`.

    GpuTypeCreate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - memory
        - availability
        - pricing
        - sortOrder
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            Immutable public catalogue code. Must be unique across the catalogue.
        name:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          example: H100
        memory:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
          description: Human-readable memory capacity.
          example: 80 GB HBM
        availability:
          $ref: '#/components/schemas/GpuAvailability'
        pricing:
          $ref: '#/components/schemas/GpuTypeCreatePricing'
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          description: >
            Display / catalogue ordering. Lower values sort first in `GET /v1/gpu-types`.

    GpuTypeUpdate:
      type: object
      minProperties: 1
      description: >
        Partial update of a catalogue entry. Omitted fields are left unchanged. The catalogue
        code itself is immutable and addressed via the path parameter. At least one field must
        be supplied.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
        memory:
          type: string
          minLength: 1
          pattern: '^\S(.*\S)?$'
        availability:
          $ref: '#/components/schemas/GpuAvailability'
        sortOrder:
          type: integer
          format: int32
          minimum: 0

    GpuTypeList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GpuType'

    # ---- Pagination --------------------------------------------------------
    Page:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null when there are no more items.

    ListSummary:
      type: object
      additionalProperties: false
      description: >
        Collection totals for a paged list. Independent of the page:
        `total` is the COUNT of items in the collection and is the same value
        on every page, including a cursor that seeks past the last row.
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: Number of items in the collection this page was drawn from.

    BuildListSummary:
      type: object
      additionalProperties: false
      description: >
        Collection totals for this app's builds list. Independent of the page:
        the same values on every cursor, including a seek past the last row.
        `total` counts builds. `versions` counts versions on the same app —
        the same predicate as `listVersions` `summary.total`, excluding
        soft-deleted versions.
      required:
        - total
        - versions
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: Number of builds recorded for this app.
        versions:
          type: integer
          format: int64
          minimum: 0
          description: >
            Number of versions recorded for this app. Same value as
            `listVersions` `summary.total`. A config-only update increments
            this without incrementing `total`.

    # ---- Money -------------------------------------------------------------
    Currency:
      type: string
      description: ISO 4217 alphabetic code. The platform bills in USD only.
      enum:
        - USD

    MoneyAmount:
      type: object
      description: >
        A monetary amount as an exact decimal string in the currency's major
        unit. Money is never represented as a float (see `GpuPricing.perSecond`).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: '^\d+\.\d+$'
          description: Amount in major units as an exact decimal string.
          example: "312.40"
        currency:
          $ref: '#/components/schemas/Currency'

    # ---- Core resources ----------------------------------------------------
    AppSummary:
      type: object
      description: >
        Aggregate dashboard metrics for every app in the authenticated
        organisation. App and worker tallies are always present (zero when
        empty). Request and error-rate totals are omitted when the metrics
        store cannot be read, rather than reported as zero. Spend is omitted
        until billing rollups exist.
      required:
        - totalApps
        - activeApps
        - activeWorkers
        - provisionedGpuCount
        - calculatedAt
      properties:
        activeApps:
          type: integer
          format: int64
          description: Apps currently in the `active` status.
        totalApps:
          type: integer
          format: int64
          description: All apps in the organisation excluding soft-deleted ones.
        activeWorkers:
          type: integer
          format: int64
          description: >
            Non-terminal workers (`status` other than `stopped`) across every
            app in the organisation.
        provisionedGpuCount:
          type: integer
          format: int64
          description: >
            Sum of `gpuCount` across those same non-terminal workers.
        requests24h:
          type: integer
          format: int64
          description: >
            Requests served in the last 24 hours across every app. Omitted when
            metrics cannot be read. Zero when the organisation had no traffic.
        errorRate24h:
          type: number
          format: double
          description: >
            Error ratio (4xx + 5xx over requests) for the last 24 hours, in 0–1.
            Omitted when metrics cannot be read or when `requests24h` is zero.
        spendToday:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: >
            Estimated spend since 00:00 UTC. Omitted until billing rollups are
            available.
        calculatedAt:
          type: string
          format: date-time
          description: When these metrics were computed.

    AppRuntime:
      type: object
      additionalProperties: false
      description: >
        Observed state for one app at `calculatedAt`. Desired worker scale remains
        in `configuration`. Worker and GPU counts are always present; traffic and
        duration fields are omitted when their backing data is unavailable.
      required:
        - activeWorkers
        - provisionedGpuCount
        - calculatedAt
      properties:
        activeWorkers:
          type: integer
          format: int64
          minimum: 0
          description: >
            Non-terminal workers (`status` other than `stopped`) on this app.
            Pending workers count because they still hold capacity.
        provisionedGpuCount:
          type: integer
          format: int64
          minimum: 0
          description: >
            Sum of `gpuCount` across those workers. A pending worker contributes
            zero until Kubernetes schedules it onto a node.
        calculatedAt:
          type: string
          format: date-time
          description: When this runtime snapshot was read from the database.
        requests24h:
          type: integer
          format: int64
          minimum: 0
          description: Requests served by this app in the last 24 hours. Omitted until available.
        errorRate24h:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Error ratio (4xx + 5xx over requests) for this app in the last 24
            hours, in 0–1. Omitted when metrics cannot be read or when the app
            had no requests in the window.
        averageRequestDuration24h:
          type: number
          format: double
          minimum: 0
          description: >
            Mean inference request duration in seconds over the last 24 hours
            (all requests; the duration histogram has no status class). Omitted
            when metrics cannot be read, when the app had no requests, or when
            the duration series has no samples for the app in the window.

    App:
      type: object
      required:
        - appId
        - appName
        - configuration
        - runtime
        - secrets
        - environmentVariables
        - status
        - isFavourite
        - createdAt
        - updatedAt
      properties:
        appId:
          $ref: '#/components/schemas/AppId'
        appName:
          $ref: '#/components/schemas/AppName'
        configuration:
          allOf:
            - $ref: '#/components/schemas/WorkerConfig'
          description: Live worker configuration. Updated via `PATCH /apps/{appId}`.
        runtime:
          $ref: '#/components/schemas/AppRuntime'
        secrets:
          type: array
          description: >
            Secrets attached to this app, including any env-var name
            override. Populated on single-app responses; list of
            apps returns an empty array to avoid an N+1 — use
            `/apps/{appId}/secrets` to page the set.
          items:
            $ref: '#/components/schemas/SecretAttachment'
        environmentVariables:
          type: array
          description: >
            Plain-text environment variables for this app. Populated on
            single-app responses (get, update, stop, resume, delete,
            deploy, favourite). List of apps returns an empty array to
            avoid an N+1 per page row — use the `/environment-variables`
            endpoints to page the set.
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        status:
          $ref: '#/components/schemas/AppStatus'
        isFavourite:
          type: boolean
          description: >
            Whether the authenticated organisation has favourited this app. Favourited apps
            sort ahead of non-favourited apps; toggled via `PUT`/`DELETE`
            `/v1/apps/{appId}/favourite`.
        activeVersionId:
          type: string
          format: uuid
          nullable: true
          description: Current deployed version; null until the first version is successfully deployed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppVolume:
      type: object
      additionalProperties: false
      required:
        - mountPath
      properties:
        mountPath:
          type: string
          minLength: 2
          maxLength: 2048
          pattern: '^/[A-Za-z0-9._/+@-]+$'
          description: >
            Absolute path exposed inside the sandboxed application. The path is the
            volume's stable identity and is mirrored below the app's node-local
            data directory. Root, duplicate, and overlapping paths are rejected.

    AppCreate:
      type: object
      # Unknown fields are rejected rather than ignored: a stale client sending a
      # field that has moved (e.g. the top-level `computeType`, now inside
      # `configuration`) must fail loudly instead of silently getting the default.
      additionalProperties: false
      required:
        - appId
        - appName
        - configuration
        - appSource
      properties:
        appId:
          $ref: '#/components/schemas/AppId'
        appName:
          $ref: '#/components/schemas/AppName'
        configuration:
          $ref: '#/components/schemas/WorkerConfigCreate'
        appSource:
          allOf:
            - $ref: '#/components/schemas/AppSourceUpsert'
          description: >
            Write-only. Source for the app's first version; not returned in the App response.
            Use the `/builds` endpoints to inspect build status.

            - `code`: the codebase is submitted to the build pipeline; a new image is built and
              deployed once ready.

            - `container`: the submitted zip is built into a wrapper image by the same
              pipeline and deployed once ready; the version records the built image, not a
              customer-supplied reference.

            Either way the version is recorded with the app, and the app transitions
            to `active` once its first version is ready, or to `failed` if the build,
            validation, or rollout fails.
        secrets:
          type: array
          description: >
            Existing organisation secrets to attach to this app, with an
            optional env-var name override per entry. This is the app's initial
            attachment set, so the first rollout carries the values into the
            worker. The secret must already exist and be `active`; this route
            does not create one, and an unknown or inactive name returns `404`.
            Shape matches `POST /apps/{appId}/secrets` so create and attach
            share one contract. Each injected name must not collide with a key
            in `environmentVariables` — see `SecretAttach`.
          items:
            $ref: '#/components/schemas/SecretAttach'
        environmentVariables:
          type: object
          description: >
            Map with environment variables. Keys are the environment variable names,
            values are the environment variable values. Use the dedicated
            `/environment-variables` endpoints to change them after the app exists.

            Each key must satisfy `EnvironmentVariableName` — POSIX-style, at most 128
            characters. OpenAPI 3.0 cannot constrain map keys, so a bad one is rejected
            by the server rather than by the schema. Keys must also not collide with
            a secret's injected env var name on the same app (see
            `attachAppSecret`).
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 4096
        volumes:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/AppVolume'
          description: >
            Persistent node-local directories bind-mounted through the checkpointer into
            the sandboxed application. Use these for downloaded weights and caches that
            must stay outside the checkpointed root filesystem. Paths must be unique and
            non-overlapping. The set is frozen into each immutable app version.

    AppUpdate:
      type: object
      description: >
        Updates one or more aspects of an app in place. All fields are optional;
        omitted fields are left unchanged. Lifecycle transitions (stop/resume/delete/deploy)
        use their dedicated operations.

        A successful configuration or `environmentVariables` update records a new
        version carrying the updated values and the same image. If that image is
        deployable, the update pins it as `activeVersionId` and rolls the workload
        when the app can take one (`active`, `initializing`, or `failed` which
        becomes `initializing`). If the image is not deployable, the version is
        recorded and `activeVersionId` is left unchanged. A name-only update
        records a version and does not pin. If the roll of a live app fails,
        `activeVersionId` is restored so the field keeps naming the running
        configuration.

        `appSource` starts a build and records version N+1 with a new image.
        The deploy queue rolls that version once the build is ready;
        `activeVersionId` moves only then. A builder rejection leaves the app
        on its current version. After accept, a late overlay race leaves
        the new version recorded and the previous attachments in place.

        `secrets` replaces the attachment set and does not roll the workload.
        Endpoints are not a field of this contract at all: the set belongs to
        the app source, so it changes only when a new version with a new source
        builds and deploys, and an unknown `endpoints` field is rejected like
        any other.
      additionalProperties: false
      properties:
        appName:
          allOf:
            - $ref: '#/components/schemas/AppName'
          description: >
            Mutable display name; does not affect app identity or routing.
            Omit to leave unchanged — an explicit blank value is rejected, not
            treated as a clear.
        configuration:
          $ref: '#/components/schemas/WorkerConfigPatch'
        appSource:
          allOf:
            - $ref: '#/components/schemas/AppSourceUpsert'
          description: >
            Write-only. New source to build and deploy; not returned in the App
            response. Use the `/builds` endpoints to inspect build status.
            Triggers a build (for `code` sources) or validates `container.yaml`
            then builds (for `container` sources). On accept the resulting
            version is recorded with a new image tag and rolled through the
            deploy queue. A builder rejection leaves the app on the previous
            version and writes no version or build row. After accept, a
            concurrent secret deactivation or env/secret collision leaves
            version N+1 recorded and the previous attachment set in place.
            `activeVersionId` moves only when that rollout completes. Not
            valid on a `stopped` or `stopping` app — there is nothing to roll
            the new version onto, and `resume` rolls the pinned one — so
            supplying it in those statuses returns `409 Conflict`.
        secrets:
          type: array
          description: >
            Replaces the app's secret attachments. Same `SecretAttach`
            shape as create and `POST /apps/{appId}/secrets`. An attachment
            absent from the array is detached. Injected names must not collide
            with a plain environment variable on the app. Control-plane record
            only — secret values do not reach a pod, and the version snapshot
            carries no secrets — so this field does not roll the workload.
            An app holds at most 100 environment bindings in total; this
            array cannot exceed that ceiling on its own.
          maxItems: 100
          items:
            $ref: '#/components/schemas/SecretAttach'
        environmentVariables:
          type: object
          description: >
            Replaces the app's environment variables. Keys are the variable
            names, values are the values. A key absent from the map is deleted.
            A null value omits that key from the new set. The resolved map is
            snapshotted onto the version this update records, so a deploy
            applies it. When the copied image is deployable the update pins
            and rolls, the same as a configuration change.
          additionalProperties:
            type: string
            nullable: true
          maxProperties: 100

    WorkerConfig:
      type: object
      required:
        - id
        - appId
        - computeType
        - gpusPerWorker
        - minWorkers
        - maxWorkers
        - idleTtlSecs
        - scalingDelaySecs
        - concurrency
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        computeType:
          $ref: '#/components/schemas/ComputeType'
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
          description: >
            Preferred GPU type. Absent (or null) only on historical
            apps created before a GPU type was required.
        fallbackGpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
          description: Secondary GPU type used if the preferred type is unavailable.
        gpusPerWorker:
          type: integer
          format: int32
          default: 1
          description: One GPU per worker is currently supported. Historical apps may contain another value.
        minWorkers:
          type: integer
          format: int32
          default: 0
          minimum: 0
          description: Floor for scale-down; 0 = scale to zero.
        maxWorkers:
          type: integer
          format: int32
          minimum: 1
        minAvailableWorkers:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: Reserved for future idle-worker buffer support.
        availableWorkersPct:
          type: integer
          format: int32
          nullable: true
          description: Reserved for future percentage-based buffer support.
        idleTtlSecs:
          type: integer
          format: int32
          description: Seconds a worker can sit idle before the Scaler removes it.
        scalingDelaySecs:
          type: integer
          format: int32
          description: Cooldown between consecutive scaling decisions.
        concurrency:
          type: integer
          format: int32
          default: 1
          description: Max tasks a single worker handles simultaneously.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkerConfigCreate:
      type: object
      additionalProperties: false
      required:
        - gpuType
        - maxWorkers
        - idleTtlSecs
        - scalingDelaySecs
      properties:
        computeType:
          allOf:
            - $ref: '#/components/schemas/ComputeType'
          default: 'gpu'
          description: >
            GPU is the only supported compute type. Omitting the field selects
            GPU. CPU workloads are not supported; a request that names `cpu` is
            rejected with 422 before a build or deploy starts.
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            GPU type the workers run on. Required: omitting it (or sending
            null) is a 422 before a build or deploy starts, because a GPU
            app with no type is unpinned and the deployer would render
            NVIDIA defaults. Must match an `id` returned by `GET /v1/gpu-types`
            that currently has admitted capacity.
        fallbackGpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeIdOrEmpty'
          nullable: true
          description: >
            Secondary GPU type used if the preferred type is unavailable. Omit,
            send JSON null, or send an empty string for no fallback — forms bind
            an unselected dropdown as `""`, which is not a `GpuTypeId`. A
            non-empty value must be an active catalogue code. Unlike `gpuType`
            this is an existence check only: it does not require admitted
            capacity, so the code may not appear in the customer
            `GET /v1/gpu-types` list.
        gpusPerWorker:
          type: integer
          format: int32
          minimum: 0
          default: 1
          description: Only 1 is currently supported. Any other value returns 422.
        minWorkers:
          type: integer
          format: int32
          minimum: 0
          default: 0
        maxWorkers:
          type: integer
          format: int32
          minimum: 1
        minAvailableWorkers:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: A non-null value returns 422 because this setting is not supported yet.
        availableWorkersPct:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
          description: A non-null value returns 422 because this setting is not supported yet.
        idleTtlSecs:
          type: integer
          format: int32
          minimum: 1
        scalingDelaySecs:
          type: integer
          format: int32
          minimum: 1
        concurrency:
          type: integer
          format: int32
          minimum: 1
          default: 1

    WorkerConfigPatch:
      type: object
      description: >
        Partial worker configuration. Any field present overwrites the live value; omitted
        fields are left unchanged. Clearing a nullable live field (setting it to null) is
        not supported — omit the field to leave it unchanged. `fallbackGpuType` is the
        exception: send an empty string to clear it. `computeType` is create-time only
        and cannot be patched. Changing `gpuType` affects only newly created workers.
      additionalProperties: false
      properties:
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          description: >
            Preferred GPU type. Omit to leave unchanged. Rejected with a 422
            when no capacity is currently offered for the type (it does not
            appear in `GET /v1/gpu-types`).
        fallbackGpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeIdOrEmpty'
          description: >
            Secondary GPU type. Omit to leave unchanged. Send an empty string
            to clear — forms bind an unselected dropdown as `""`. JSON null is
            rejected: this field is not nullable, so a client that meant to
            clear must send `""` rather than null. A non-empty value must be
            an active catalogue code. Unlike `gpuType` this is an existence
            check only: it does not require admitted capacity, so the code
            may not appear in the customer `GET /v1/gpu-types` list.
        gpusPerWorker:
          type: integer
          format: int32
          minimum: 0
          description: Only 1 is currently supported. Any other value returns 422.
        minWorkers:
          type: integer
          format: int32
          minimum: 0
        maxWorkers:
          type: integer
          format: int32
          minimum: 1
        minAvailableWorkers:
          type: integer
          format: int32
          minimum: 0
          description: Reserved for future use. Supplying it returns 422.
        availableWorkersPct:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Reserved for future use. Supplying it returns 422.
        idleTtlSecs:
          type: integer
          format: int32
          minimum: 1
        scalingDelaySecs:
          type: integer
          format: int32
          minimum: 1
        concurrency:
          type: integer
          format: int32
          minimum: 1

    Version:
      type: object
      description: >
        An immutable record of what to deploy. One is created with the app and one on
        every update, so a rollout always names a version rather than reading configuration
        that may since have changed. `listVersions` and `getVersion` return this same shape.
        The version internally pins the exact image digest its build pushed, and everything
        the version references — the built image and the submitted source — is retained for
        the life of the version.

        Computed fields:

        - `buildDurationMs` is the wall-clock duration of the build this version names.
          Null while the build is running or when no completion time is available. A
          config-only update carries the image — and therefore this duration — forward.

        - `changes` is the structured diff against the previous version. Null on version 1
          (no predecessor). A name-only update still inserts a version; `changes` is then
          present with `imageChanged` false and no field diffs.
      required:
        - id
        - appId
        - versionNumber
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        versionNumber:
          type: integer
          format: int32
          description: Monotonically increasing per app.
        buildId:
          type: string
          format: uuid
          nullable: true
          description: >
            The build that produced this version's image. Both source types build — a
            `code` source bakes an image around a submitted codebase, a `container` source
            builds the customer's own wrapper Dockerfile. A version created by an update
            carries the image, and therefore this build, forward.
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
          description: >
            Preferred GPU type of this version, taken from the config snapshot.
        author:
          type: object
          allOf:
            - $ref: '#/components/schemas/TriggeredBy'
          nullable: true
          description: >
            Who created this version — the authenticated user (JWT) or the API key.
            `displayName` is the name captured at write time.
        buildDurationMs:
          type: integer
          format: int64
          nullable: true
          description: >
            Wall-clock milliseconds of the named build (`completedAt - createdAt` on that
            build). Null while the build is running or when no completion time is
            available. Bytes and units are not included; this is a raw millisecond count.
        changes:
          type: object
          allOf:
            - $ref: '#/components/schemas/VersionChanges'
          nullable: true
          description: >
            Structured diff against the previous version. Null on version 1.
        createdAt:
          type: string
          format: date-time

    VersionChanges:
      type: object
      additionalProperties: false
      description: >
        How this version differs from the previous one. Environment-variable *values*
        never appear — only keys — so a secret-bearing env var cannot leak through the
        versions list. Numeric worker-config fields are rendered as decimal-free
        integer strings (the same spelling the event log uses). Empty collections are
        omitted: a name-only update is `{ "imageChanged": false }`.
      required:
        - imageChanged
      properties:
        imageChanged:
          type: boolean
          description: >
            True when this version names a different image than the previous one
            (`buildId` or `imageRef` changed). False for a config-only update, which
            carries the image forward.
        workerConfig:
          type: array
          items:
            $ref: '#/components/schemas/VersionConfigChange'
        environmentVariables:
          $ref: '#/components/schemas/VersionKeySetDiff'
        endpoints:
          $ref: '#/components/schemas/VersionKeySetDiff'
        volumes:
          $ref: '#/components/schemas/VersionKeySetDiff'

    VersionConfigChange:
      type: object
      additionalProperties: false
      description: >
        One worker-config field that changed. `field` is the public JSON name
        (`gpuType`, `minWorkers`, `idleTtlSecs`, …). `from` / `to` are strings;
        null means the field was unset on that side.
      required:
        - field
        - from
        - to
      properties:
        field:
          type: string
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true

    VersionKeySetDiff:
      type: object
      additionalProperties: false
      description: >
        Keys added, removed, or changed between consecutive versions. For
        environment variables, `changed` is keys whose *value* changed (the value
        itself is never returned). For endpoints the key is the path; for volumes
        it is `mountPath`. `changed` is omitted on those two (a path either exists
        or does not).
      properties:
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
        changed:
          type: array
          items:
            type: string

    BuildPhase:
      type: object
      description: >
        One observed step of a build, in execution order. The phase list is open:
        which phases a build reports depends on its kind and on how it ran, so
        clients must not assume a fixed set of names or a fixed count.
      required:
        - name
        - startedAt
        - outcome
      properties:
        name:
          type: string
          description: >
            Phase identifier, e.g. `prepare`, `build`, `index`. Deliberately not
            an enum — new build kinds report new phases without a contract change.
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the phase is still running.
        outcome:
          type: string
          enum:
            - running
            - succeeded
            - failed

    Build:
      type: object
      description: >
        Details of a build. Both source types build, and `kind` says which pipeline ran:
        a `code` submission or a customer's own wrapper Dockerfile. Phase lists differ by
        kind, so never assume a fixed one. `listBuilds` and `getBuild` return this same
        shape.


        Nullability:

        - `error` is null while the build is running (`queued`, `building`), on success
          (`ready`), and on `superseded` (a newer version took over — the `status` conveys
          that, and it is not a failure); it is present only on `failed`.

        - `completedAt` and `durationMs` are null while the build is running and set once it
          reaches a terminal status (`ready`/`failed`/`superseded`). They are also null for
          terminal builds that finished before completion timestamps were tracked.

        - `exitCode` is null while running. On a terminal build it carries the build Job's
          exit code when the builder still had it to report; it can remain null on a terminal
          build whose Job aged out before the code was read.

        - `versionId` / `versionNumber` name the version this build produced. A code build's
          version is created together with the build, so these are populated from the moment
          the build exists, in every status; they are null only when no version references the
          build. When later config updates carry the build forward onto new versions, this is
          the earliest — the one the build actually produced.

        - `triggeredBy` names the user or API key that submitted the build; it is null only
          for builds created before the actor was recorded.
      required:
        - id
        - status
        - source
        - phases
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        source:
          $ref: '#/components/schemas/BuildSource'
        triggeredBy:
          $ref: '#/components/schemas/TriggeredBy'
        status:
          $ref: "#/components/schemas/BuildStatus"
        versionId:
          type: string
          format: uuid
          nullable: true
          description: >
            The version this build produced. A code build's version is created together with
            the build, so this is populated in every status; it is null only when no version
            references the build. A code update carries an image — and so its build — forward
            onto a new version, so a build may be named by several versions; this is the
            earliest, the one the build actually produced.
        versionNumber:
          type: integer
          format: int32
          nullable: true
          description: Version number of `versionId`; null when `versionId` is null.
        error:
          type: string
          nullable: true
          description: Error message or failure reason; null when the build is still running or succeeded.
        exitCode:
          type: integer
          format: int32
          nullable: true
          description: >
            Exit code of the build container: 0 on success, its non-zero code on a build
            failure. Null while running, on a terminal build whose exit code the builder
            could no longer report, and when the build container never ran (e.g. an init
            container such as dockerfile generation failed first).
        logTail:
          type: string
          nullable: true
          description: Trailing build log output.
        durationMs:
          type: integer
          format: int64
          nullable: true
          description: >
            Wall-clock milliseconds from `createdAt` to `completedAt`; null while the build is
            still running or when no completion time was recorded.
        phases:
          type: array
          items:
            $ref: "#/components/schemas/BuildPhase"
          description: >
            Observed build phases with their timings, recorded once the build is
            terminal; empty until then. Phase lists differ by `source.type`;
            never assume a fixed list.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the build reached a terminal status (`ready`/`failed`/`superseded`); null
            while running or for terminal builds recorded before this was tracked.

    BuildSource:
      type: object
      description: >
        Where a build's source came from: `code` for a customer code submission, `container`
        for a customer wrapper Dockerfile. `repository` and `revision` are not yet recorded
        (both sources are zip uploads) and will be added when the platform stores that
        provenance.
      required:
        - type
      properties:
        type:
          type: string
          description: >
            The kind of source that produced this build — `code` or `container`, straight
            from the build record. Build phases differ by kind, so clients must not assume
            a fixed phase list. Not modelled as an enum so adding a kind later does not
            churn the existing source-type constants this API shares.

    TriggeredBy:
      type: object
      description: >
        Who performed an action — the authenticated user (JWT) or the API key.
        `kind` says which, so `id` (that actor's UUID) is resolvable to the right thing;
        `displayName` is its name captured at write time, so it renders as it was even if
        the user or key is later renamed. Used as `Build.triggeredBy` and `Version.author`.
      required:
        - kind
        - id
        - displayName
      properties:
        kind:
          type: string
          enum: [user, apiKey]
          description: Whether the actor is a user (JWT) or an API key.
        id:
          type: string
          format: uuid
        displayName:
          type: string

    ContainerSource:
      type: object
      additionalProperties: false
      required:
        - sourceId
      properties:
        sourceId:
          allOf:
            - $ref: '#/components/schemas/SourceId'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: >
            Id of a source published by a completed upload in this organization
            (`POST /v1/source-uploads`, then `complete`). The archive
            it names carries a wrapper `Dockerfile` and a `container.yaml`
            config document at its root, plus any build-context files the
            Dockerfile copies in. Runware builds the image from it — resolving
            the Dockerfile's public base images to immutable digests — and
            hosts the result, so no image reference or pull credential is
            supplied: a private base image is not supported until a build-time
            credential mechanism exists. An invalid `container.yaml` rejects the
            create — `400` where the document could not be parsed, `422` where it
            parsed and broke a rule — with `errors[]` entries carrying
            `configPointer` into the document; the endpoint set it declares
            becomes visible once the first build is ready and deployed. A source
            is immutable and reusable: the same `sourceId` may back any number of
            apps and versions in the organization.

    CodebaseSource:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - modelFile
      properties:
        sourceId:
          allOf:
            - $ref: '#/components/schemas/SourceId'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: >
            Id of a source published by a completed upload in this organization
            (`POST /v1/source-uploads`, then `complete`). The archive it names is the
            zip of the customer's code. A source is immutable and reusable: the same
            `sourceId` may back any number of apps and versions, each choosing its own
            `modelFile`.
        modelFile:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^/\\\s]\S*$'
          description: >
            Path of the MLflow model entry point inside the archive, relative to its root
            (e.g. `model.py`). Version execution configuration rather than archive
            identity, so two apps may run one source with different entry points. The
            build proves the file is in the archive and answers `422` when it is not.

    AppSourceUpsert:
      type: object
      required:
        - type
        - source
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/AppSourceType'
          description: >
            Selects the version creation path. `code` submits customer source code to
            the Image Build Service; `container` submits a wrapper `Dockerfile` and
            `container.yaml` for Runware to build into a hosted image.
        source:
          oneOf:
            - $ref: '#/components/schemas/CodeSourceUpsert'
            - $ref: '#/components/schemas/ContainerSource'

    CodeSourceUpsert:
      type: object
      required:
        - baseImage
        - codebase
      properties:
        baseImage:
          type: string
          description: Base image for the builder, e.g. `python:3.11-slim`.
        requirements:
          type: array
          items:
            type: string
          description: Additional pip packages to install alongside the codebase.
        codebase:
          $ref: '#/components/schemas/CodebaseSource'

    DeployRequest:
      type: object
      required:
        - versionNumber
      properties:
        versionNumber:
          type: integer
          format: int32
          description: >
            Version number to deploy. Must reference a `ready` version on this app.
            Any in-progress or queued builds are cancelled. Use an older version number to roll back.

    Endpoint:
      type: object
      required:
        - id
        - appId
        - path
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        path:
          type: string
          description: >
            The endpoint's identity within the app: a bare lowercase URL
            segment, e.g. `generate`, with no leading slash. Unique within the
            app, so it identifies the endpoint on its own.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Worker:
      type: object
      description: >
        A worker instance observed from Kubernetes. Read-only runtime state written
        by the reconciler; `id` is the pod UID.


        Address a worker by `id`, which is stable for the life of the pod, and show
        `podName`, which is the name the same pod has in the cluster. There is no
        separate short identifier.


        Uptime is derived, not carried: a worker has been up from `createdAt` until
        `statusOccurredAt` once its `status` is `stopped`, and until now before that.
      required:
        - id
        - appId
        - versionId
        - podName
        - status
        - gpuCount
        - statusOccurredAt
        # Required because the uptime derivation above rests on it, and the column it
        # comes from is NOT NULL. updatedAt is always sent too but carries no such
        # contract, so it stays optional.
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        versionId:
          type: string
          format: uuid
        podName:
          type: string
        nodeName:
          type: string
          nullable: true
          description: Kubernetes node the pod is scheduled on. Omitted while still pending.
        status:
          $ref: '#/components/schemas/WorkerStatus'
        statusReason:
          type: string
          nullable: true
          description: >
            Kubernetes-facing reason for the current status when unhealthy or otherwise
            notable (e.g. `ImagePullBackOff`, `CrashLoopBackOff`).
        statusOccurredAt:
          type: string
          format: date-time
          description: >
            When the worker entered its current status. For a `stopped` worker this is
            when it stopped, so it is also the end of the worker's uptime.
        gpuCount:
          type: integer
          format: int32
          minimum: 0
          description: GPUs attached to this worker at observation time.
        gpuType:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuTypeId'
          nullable: true
          description: GPU catalogue code snapshotted at observation time; omitted for CPU workers.
        gpuAvailability:
          type: string
          allOf:
            - $ref: '#/components/schemas/GpuAvailability'
          nullable: true
          description: >
            How the catalogue currently provisions this worker's `gpuType`. Omitted for a
            CPU worker and for a code the catalogue no longer holds. Unlike `gpuType` this
            is read now rather than snapshotted, so it tells you how that GPU is supplied
            today, not how it was supplied when the worker started.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Worker-reported liveness. Omitted until the worker reports; stays
            absent until a heartbeat path exists (phase 2).
        createdAt:
          type: string
          format: date-time
          description: >
            Pod creation time (`metadata.creationTimestamp`), not insert time. It is also
            the start of the worker's uptime.
        updatedAt:
          type: string
          format: date-time

    OrgTenancyDesiredState:
      type: string
      description: >
        Client-writable tenancy state. `active` runs Ensure; `disabled` runs
        teardown. `pending` is server-only on the receipt and is rejected.
      enum:
        - active
        - disabled
    OrgTenancyUpsert:
      type: object
      additionalProperties: false
      description: >
        Desired serverless tenancy for a customer organisation. The UUID is
        the organisation being provisioned, not the authenticated caller.
      required:
        - organizationUuid
        - state
      properties:
        organizationUuid:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/OrgTenancyDesiredState'
    OrgTenancy:
      type: object
      description: >
        Receipt that an organisation has been provisioned for serverless
        (ADR-019). Names are derived from the organisation UUID; this object
        is the state machine, not a directory.
      required:
        - organizationUuid
        - state
        - ksaName
      properties:
        organizationUuid:
          type: string
          format: uuid
        state:
          type: string
          description: >
            `pending` while Ensure is in flight, `active` when key, KSA and
            bindings have converged, `disabled` after teardown. Rows are
            tombstones — disable does not delete.
          enum:
            - pending
            - active
            - disabled
        ksaName:
          type: string
          description: Kubernetes service account in the shared app namespace (`org-<uuid>`).
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

    Secret:
      type: object
      description: Secret metadata. The encrypted value is never returned.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/SecretName'
        type:
          $ref: '#/components/schemas/SecretType'
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional opaque metadata associated with the secret.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SecretAttachment:
      description: >
        A secret attached to an app. The encrypted value is never returned.
        The database always stores the injected env var name; this response omits
        `envVarName` when it equals the secret `name` (no override).
      allOf:
        - $ref: '#/components/schemas/Secret'
        - type: object
          properties:
            envVarName:
              type: string
              allOf:
                - $ref: '#/components/schemas/EnvironmentVariableName'
              nullable: true
              description: >
                Resolved environment variable name when it differs from `name`.
                Omitted when the secret name is used. Same reserved-name rules
                as `SecretName` when set.

    SecretAttach:
      type: object
      description: >
        Attach an organisation secret to an app. The resolved name
        (`envVarName`, or `secretName` when omitted) is the environment variable
        the secret is injected as, and the next rollout carries the value into
        the worker. It must be unique among this app's secret attaches and must
        not collide with a plain environment variable key on the same app —
        both names land in the same pod env namespace. Reserved platform names
        are rejected as on `SecretName`.
      required:
        - secretName
      properties:
        secretName:
          $ref: '#/components/schemas/SecretName'
        envVarName:
          type: string
          allOf:
            - $ref: '#/components/schemas/EnvironmentVariableName'
          nullable: true
          description: >
            Environment variable name the secret is injected as. Omit or null to
            use `secretName`; the server resolves and stores the final name. Same
            reserved-name rules as `SecretName` (`422` if reserved). The resolved
            name must also not collide with a plain environment variable key on
            this app (`422`).

    SecretCreate:
      type: object
      required:
        - name
        - type
        - value
      properties:
        name:
          $ref: '#/components/schemas/SecretName'
        type:
          $ref: '#/components/schemas/SecretType'
        value:
          type: string
          maxLength: 65536
          description: >
            Plain-text value; encrypted at rest by the platform. Capped at 64 KiB
            — Cloud KMS Encrypt's plaintext ceiling, and the reason the design
            needs no envelope encryption (ADR-019).

            `maxLength` is OpenAPI's string-length bound (character count), not
            a byte limit. Cloud KMS measures UTF-8 bytes, so the server also
            rejects a value whose UTF-8 encoding exceeds 65536 bytes with
            `422` — a rule this schema cannot express alone (multi-byte
            characters can pass `maxLength` and still overrun the KMS limit).
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    SecretUpdate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          maxLength: 65536
          description: >
            Plain-text value; encrypted at rest by the platform. Same 64 KiB
            Cloud KMS plaintext ceiling and UTF-8 byte check as
            `SecretCreate.value`.
        metadata:
          type: object
          additionalProperties: true
          description: >
            Omit to leave the stored metadata unchanged. Send an object
            (including `{}`) to replace it.

    EnvironmentVariable:
      type: object
      required:
        - key
        - value
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        key:
          $ref: '#/components/schemas/EnvironmentVariableName'
        value:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnvironmentVariableUpdate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          maxLength: 4096
          description: >
            Value delivered to the workload as this variable's value. Bounded because
            every variable ends up in the pod template, which as a whole has to fit
            what the Kubernetes API server accepts — the same `maxLength` create
            applies, so one path cannot be used to exceed the other.

    TaskInvocation:
      type: object
      additionalProperties: false
      required:
        - taskId
        - payload
      description: >
        The request body for both invoke routes. The endpoint's own input schema
        describes `payload`, never the whole body, so no platform field can
        collide with one of the app's own. Unknown top-level members are rejected
        rather than ignored: the envelope is the platform's to extend, and
        silently accepting a stray member would make a later addition breaking.
      properties:
        taskId:
          $ref: '#/components/schemas/TaskId'
        payload:
          type: object
          additionalProperties: true
          description: >
            The body the endpoint's handler receives, validated against the
            endpoint's declared input schema. An endpoint that declares none
            takes it unvalidated.

    TaskId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: >
        Client-generated task identifier, canonical lowercase UUID. One id is one
        task: resubmitting it is answered with the task it already names rather
        than starting a second, so a request whose response was lost can be sent
        again without paying for the work twice. Reusing an id for a different
        request returns the first task, so the id is the caller's to keep unique.

    Task:
      type: object
      required:
        - id
        - status
        - appId
        - endpointPath
        - createdAt
      properties:
        id:
          type: string
          description: Task identifier, supplied by the caller when the task was submitted.
        status:
          $ref: '#/components/schemas/TaskStatus'
        appId:
          $ref: '#/components/schemas/AppId'
        endpointPath:
          $ref: '#/components/schemas/EndpointPath'
        output:
          type: object
          additionalProperties: true
          nullable: true
          description: Inference result payload on success; null otherwise.
        error:
          type: string
          nullable: true
          description: Failure detail when status is `failed`; null otherwise.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    UsageEvent:
      type: object
      required:
        - id
        - appId
        - workerId
        - eventType
        - gpuCount
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        workerId:
          type: string
          format: uuid
        eventType:
          # allOf so the description is not a sibling of $ref (ignored in OAS 3.0).
          allOf:
            - $ref: '#/components/schemas/WorkerStatus'
          description: >
            Status the worker transitioned into. The ledger emits a subset of
            `WorkerStatus` — `busy` never appears (queue occupancy, not a pod
            lifecycle transition).
        gpuCount:
          type: integer
          format: int32
        occurredAt:
          type: string
          format: date-time
          description: >
            When the transition happened. This is the event time the `from` and
            `to` filters apply to, and the field to bill on.
        createdAt:
          type: string
          format: date-time
          description: When the event was recorded. Audit only — may lag `occurredAt`.

    AppEvent:
      type: object
      required:
        - id
        - appId
        - type
        - message
      properties:
        id:
          type: string
          format: uuid
        appId:
          $ref: '#/components/schemas/AppId'
        workerId:
          type: string
          format: uuid
          nullable: true
        endpointId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/AppEventType'
        message:
          type: string
          pattern: '\S'
          description: Human-readable description of what happened. Never blank.
        createdAt:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: >
        RFC 9457 problem details. Every error response from this API uses this
        schema with media type `application/problem+json`. `type` is a URI that
        identifies the problem class and dereferences to its documentation;
        clients should switch on `type` (not `status` or `detail`, which are not
        stable identifiers). Additional members beyond those below may appear.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: >
            URI reference identifying the problem type. Dereferences to
            human-readable documentation. `about:blank` denotes "no semantics
            beyond the HTTP status".
          example: https://docs.runware.ai/serverless/errors#not-found
        title:
          type: string
          description: >
            Short, human-readable summary of the problem type (the standard HTTP
            status text). Stable for a given `type`; does not change from
            occurrence to occurrence.
          example: Not Found
        status:
          type: integer
          format: int32
          description: HTTP status code generated for this occurrence.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: No app 'img-gen' exists for the authenticated organisation.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence (the request path).
          example: /v1/apps/img-gen
        requestId:
          type: string
          description: >
            Extension member. Correlation id for this request, echoed in the
            `X-Request-Id` response header; quote it when reporting problems.
        endpointPath:
          type: string
          description: >
            Extension member. Present on a `404` from task invocation when the
            app exists but does not declare the requested endpoint path;
            its presence distinguishes an unknown endpoint from an unknown
            app. Carries the rejected path.
          example: generate
        errors:
          type: array
          description: >
            Extension member. Present on validation failures (`422`); one entry
            per offending request field.
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      type: object
      description: A single field-level validation error within a ProblemDetails.
      required:
        - detail
      properties:
        detail:
          type: string
          description: Human-readable reason this field was rejected.
          example: is required
        pointer:
          type: string
          description: >
            JSON Pointer (RFC 6901) to the offending field in the request body,
            e.g. `/configuration/maxWorkers`. Absent for non-body parameters.
          example: /configuration/maxWorkers
        configPointer:
          type: string
          description: >
            JSON Pointer (RFC 6901) to the offending field inside a document the
            request carried, rather than in the request body itself: a container
            source's `container.yaml`. On such a rejection `pointer` names where
            the archive sat in the request body and this member names the field
            inside the document. A rejection about the archive rather than the
            document carries no `configPointer`, because nothing was parsed.
          example: /endpoints/0/path
    QueryCatalogue:
      type: object
      required: [metrics, logs]
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueEntry'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueEntry'
    CatalogueEntry:
      type: object
      required: [id, unit, aggregation, windows, selectors, series]
      properties:
        id:
          type: string
          description: The value to pass as `queryId`.
        unit:
          type: string
          description: The unit of every value in this query's series, e.g. `req/min`.
        aggregation:
          type: string
          description: >
            How each bucket was reduced, e.g. `avg` or `p50`. Carried so a tooltip can say
            what a point means rather than presenting a bucket reduction as an instant
            reading.
        windows:
          type: array
          description: >
            The windows this query can answer. A window absent here has no stored series
            behind it, so a client should not offer it.
          items:
            type: string
        selectors:
          type: array
          description: The narrowings this query accepts. Anything else is rejected.
          items:
            type: string
        series:
          type: array
          description: >
            The stable series ids this query returns. Empty when those ids are not known
            until the request (`apps_request_volume` keys each line on an app id).
          items:
            type: string
    MetricSeries:
      type: object
      required: [query, unit, step_s, aggregation, window, t, series]
      properties:
        query:
          type: string
        unit:
          type: string
        step_s:
          type: integer
          format: int64
          description: Seconds between adjacent timestamps in `t`.
        aggregation:
          type: string
        window:
          $ref: '#/components/schemas/MetricWindowRange'
        t:
          type: array
          description: >
            The timestamp axis, shared by every series. Each value is the END of its
            bucket, in unix seconds: a point at `t[i]` is the aggregate over
            `(t[i] - step_s, t[i]]`, which is what the underlying range functions compute.
          items:
            type: integer
            format: int64
        series:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeriesEntry'
    MetricWindowRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: integer
          format: int64
          description: >
            EXCLUSIVE: one `step_s` before the first timestamp in `t`. Nothing is sampled
            at `from` itself.
        to:
          type: integer
          format: int64
          description: INCLUSIVE, and equal to the last timestamp in `t`.
      description: The range covered, as `(from, to]`.
    MetricSeriesEntry:
      type: object
      required: [id, label, v]
      properties:
        id:
          type: string
          description: >
            Stable identifier for this line. For chart queries it does not change, so a
            client can map it to a colour or legend position. For `apps_request_volume`
            it is the app id of that line.
        label:
          type: string
          description: Display text. May change without notice; do not switch on it.
        v:
          type: array
          description: >
            Values, positionally aligned to `t` and always the same length. `null` is a
            genuine absence of data, never a zero, and is sent explicitly rather than
            omitted so a gap draws as a gap instead of a line across an outage.
          items:
            type: number
            format: double
            nullable: true
    LogEntryPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        nextCursor:
          type: string
          description: Opaque; absent on the last page.
    LogEntry:
      type: object
      required: [time, body]
      properties:
        time:
          type: integer
          format: int64
        level:
          type: string
        body:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
