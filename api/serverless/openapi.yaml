  # ---------------------------------------------------------------------------
  # Secrets (organisation-scoped)
  # ---------------------------------------------------------------------------
  /v1/secrets:
    get:
      tags:
        - Secrets
      summary: List secrets
      description: Returns secret metadata only; encrypted values are never returned.
      operationId: listSecrets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the authenticated organisation's secrets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Secret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Secrets
      summary: Create a secret
      description: >
        Creates an organisation-scoped secret. Returns `409` if the name is
        already in use — including when a secret of that name is
        `pending_destroy`. List only shows active secrets, so a name can appear
        free while create still conflicts for as long as that row remains.
        A `pending_destroy` row is removed, and its name released, by a
        background sweep once no running worker can still hold the value —
        there is no deadline on that wait, so a continuously busy app can hold
        a name for as long as it runs. Recreate-while-deleting may later
        reuse the pending row with the new value (same name, new ciphertext).
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/secrets/{secretName}:
    put:
      tags:
        - Secrets
      summary: Update a secret
      operationId: updateSecret
      parameters:
        - $ref: '#/components/parameters/SecretName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Updated secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Secrets
      summary: Delete a secret
      description: >
        Soft-deletes a secret: marks the row `pending_destroy` and bumps
        revision. This API does not hard-delete the row. A background sweep
        removes the row and releases the name once no running worker can still
        hold the value — the value travels inside the worker's own environment,
        which is fixed when the container starts, so a worker keeps it until it
        stops. There is no deadline on that wait. Returns `409` while any
        app still attaches it — cascade-detach is not performed here;
        detach each holder with
        `DELETE .../apps/{id}/secrets/{name}` first. Attach and detach change
        the secret set for the next rollout. Neither operation rolls workers.
        While the row remains `pending_destroy` the name stays reserved, so
        create may return `409` even though list no longer shows the secret.
        Retries on an already-pending name are safe when no attachments remain
        (`204`); they still return `409` while attached.
      operationId: deleteSecret
      parameters:
        - $ref: '#/components/parameters/SecretName'
      responses:
        '204':
          description: >
            Delete accepted (or already pending with no attachments). The name
            remains reserved while the row is `pending_destroy`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Organisation tenancy (ADR-019 Option 2b)
  # ---------------------------------------------------------------------------
  /v1/org-tenancies:
    put:
      tags:
        - Tenancy
      summary: Set an organisation's serverless tenancy state
      description: >
        Idempotent upsert for one customer organisation. The customer UUID
        is in the body — public paths never carry an organisation identifier
        (the authenticated API key names the *caller*, which for this route
        must be the Runware platform organisation).


        `state: active` runs Ensure: a Cloud KMS CryptoKey named after the
        organisation UUID, a Kubernetes service account `org-<uuid>` in the
        shared app namespace, and a decrypt IAM binding on that key for the
        KSA principal. `state: disabled` runs teardown: disable the key's
        primary version, drop the decrypt binding, delete the KSA. It then
        stops the organisation's estate: every deployment that is `active`
        moves to `stopping` and has its drain enqueued, and that stop is one
        database transaction — the `200` is returned only once it has
        committed, so it guarantees every deployment that was active is on
        its way to `stopped`. The key itself is not destroyed — a destroyed
        key makes every ciphertext under it permanently unreadable. The
        local row stays as a tombstone so a later Ensure converges on the
        same names; a later Ensure does not resume the deployments this
        disable stopped — restoring the organisation's IAM is not the same
        decision as restarting its workload, and this route does not conflate
        them. A stopped deployment stays stopped until its own resume call,
        the same as one the customer stopped directly.


        A retry after a partial failure converges rather than duplicating
        objects. `200` returns the resulting receipt. `503` when Cloud KMS
        key-admin is rate-limited (60 writes/min) or otherwise unavailable,
        or when the tenancy was disabled but the deployment stop could not
        be committed — the tenancy row is already `disabled` in that case,
        and the same PUT retried stops whatever is still active; the caller
        (admin-api Messenger) retries the same PUT either way.
      operationId: upsertOrgTenancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgTenancyUpsert'
      responses:
        '200':
          description: Tenancy is in the requested state (created, already present, or disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgTenancy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # App <-> secret attachments
  # ---------------------------------------------------------------------------
  /v1/apps/{appId}/secrets:
    get:
      tags:
        - Secrets
      summary: List secrets attached to an app
      operationId: listAppSecrets
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of attached secrets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SecretAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Secrets
      summary: Attach a secret to an app
      description: >
        Records that an organisation secret is attached to an app under a
        resolved env-var name. The next rollout injects the value into the
        worker. This operation does not roll workers. Returns `409` if the
        secret is already attached, or if another attach would use the same
        env-var name.

        The resolved name (`envVarName`, or `secretName` when omitted) must not
        already exist as a plain environment variable on this app
        (`deployment_configs.key`). Both sources use the same pod env namespace,
        so the server rejects the collision with `422`
        instead of allowing a last-wins override later. The reverse check
        applies when setting a plain environment variable.

        An app holds at most 100 environment bindings in total — plain
        environment variables plus attached secrets — the same combined ceiling
        as create and the single-key env-var route. Attaching when the
        app is already at that limit returns `422`.
      operationId: attachAppSecret
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretAttach'
      responses:
        '204':
          description: Secret attached
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/apps/{appId}/secrets/{secretName}:
    delete:
      tags:
        - Secrets
      summary: Detach a secret from an app
      description: >
        Removes the attachment from the next rollout. This operation does not
        roll workers. Existing workers keep the value until they stop.
      operationId: detachAppSecret
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/SecretName'
      responses:
        '204':
          description: Attachment removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

