version: 2
builds:
  - main: .
    binary: runware
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - name_template: "runware_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat(\(.+\))?!?:.+'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix(\(.+\))?!?:.+'
      order: 1
    - title: "Performance"
      regexp: '^perf(\(.+\))?!?:.+'
      order: 2
    - title: "Other"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - '^refactor:'
      - Merge pull request
      - Merge branch
