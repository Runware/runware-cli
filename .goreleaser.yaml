version: 2
project_name: runware-cli

builds:
  - main: ./cmd/runware
    binary: runware
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - name_template: "runware_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

homebrew_casks:
  - name: runware
    homepage: https://runware.ai
    description: A command-line tool for interacting with the Runware inference API.
    license: MIT
    repository:
      owner: Runware
      name: homebrew-tap
    # TODO(dr): remove when we have Apple Developer ID approved.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/runware"]
          end

scoops:
  - name: runware
    repository:
      owner: Runware
      name: scoop-bucket
    directory: bucket
    homepage: https://runware.ai
    description: A command-line tool for interacting with the Runware inference API.
    license: MIT
