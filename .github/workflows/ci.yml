name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: go test -race -timeout 2m ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate docs
        run: make docs

      - name: Check docs are up to date
        run: |
          if ! git diff --exit-code docs/; then
            echo "Docs are out of date. Run 'make docs', review and commit the result."
            exit 1
          fi
