name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: go test -race -timeout 2m ./...

      # Compile and test the internal build (build tag: internal) so the tagged
      # files don't silently break. The steps above already cover the public build.
      - name: Build (internal)
        run: go build -tags internal ./...

      - name: Test (internal)
        run: go test -tags internal -race -timeout 2m ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Lint (internal)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --build-tags=internal
