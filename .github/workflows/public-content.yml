name: Public content

# This repository is public. Check that a pull request publishes nothing that
# must stay private: its diff, commit messages, branch name, title and body.
# Rerun when the title or body is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-public:
    runs-on: ubuntu-latest
    steps:
      # A plain fetch instead of actions/checkout, whose log lists the
      # branch and the commit message the author wrote. The base and head
      # come from the event file, never from author text, and the step
      # prints nothing but a fixed message on failure. Fetching both commits
      # in full gives the merge-base the range scan needs.
      - name: Fetch the base and head commits
        run: |
          base=$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")
          head=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
          for sha in "$base" "$head"; do
            if ! printf '%s\n' "$sha" | grep -Eqx '[0-9a-f]{40}|[0-9a-f]{64}'; then
              echo "The event has no pull request base and head commit."
              exit 1
            fi
          done
          git init -q -b checkpublic
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --no-tags origin "$base" "$head" > /dev/null 2>&1 || {
            echo "Fetching the base and head commits failed (git fetch exit $?)."
            exit 1
          }
          git -c advice.detachedHead=false checkout -q --detach "$head" > /dev/null 2>&1 || {
            echo "Checking out the head commit failed (git checkout exit $?)."
            exit 1
          }
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The checker is built from the base commit when it exists there, so a
      # change to tools/checkpublic does not judge its own pull request. A
      # pull request runs this workflow file as it has it, though, so it can
      # change or remove this step. The guard against that is CODEOWNERS:
      # .github/workflows/ and tools/checkpublic/ need a code owner's review
      # before a change to them merges to main.
      - name: Build checkpublic
        run: |
          src=.
          if git cat-file -e "$BASE_SHA:tools/checkpublic/main.go" 2>/dev/null; then
            src="$RUNNER_TEMP/checker-source"
            git worktree add -q --detach "$src" "$BASE_SHA"
          fi
          (cd "$src" && go build -o "$RUNNER_TEMP/checkpublic" ./tools/checkpublic)

      # The title, body and branch name are written by the PR author. The
      # runner prints a step's env in the public log, so they reach the tool
      # neither through env nor through ${{ }} in run: it reads them, and the
      # base and head, from the event file at GITHUB_EVENT_PATH. It hides
      # matched text in the log and the job summary, which are public.
      - name: Check diff, commits, branch name, title and body
        run: |
          if ! "$RUNNER_TEMP/checkpublic" pr -redact; then
            echo "This repository is public. Remove the findings above: edit the title or body, or rewrite the commits with neutral messages and force-push. Then delete the old revisions of an edited description in the GitHub UI."
            exit 1
          fi
